<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%234A7C59'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23F7F4E9'%3E羅%3C/text%3E%3C/svg%3E">
<title>視界致富羅盤・我的帳本</title>
<style>
/* =====================================================================
   視界致富羅盤・副控台（組長銀行台）
   ---------------------------------------------------------------------
   設計三原則（規格書第八節，逐條驗收）：
     易讀 — 指令字 ≥32px、金額 ≥40px、一頁只有一個主要指令、顏色語意固定
     易懂 — 完整白話句子，不出現遊戲術語，每張卡右下角有「為什麼」
     易執行 — 主按鈕位置固定 ≥56px、每步都能上一步、點 N 下＝N 單位、全程免打字
   顏色語意（全站不可改變）：綠＝發錢給學員／紅＝跟學員收錢／金＝投資相關
===================================================================== */
:root{
  --cream:#F7F4E9; --paper:#FFFDF6; --ink:#2C2A24; --ink-soft:#6B6455;
  --green:#4A7C59; --green-900:#2E4A38; --green-50:#E8F0E8;
  --gold:#C9A24B; --gold-deep:#8A6A1E; --gold-50:#FAF2DD;
  --brick:#A94436; --brick-900:#7A2E23; --brick-50:#FBE9E5;
  --line:#DDD6C2; --line-2:#C9C0A6;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--cream);color:var(--ink);font-family:var(--sans);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- 開場：房號 → 桌號 → 人數姓名 ---------- */
#setup{position:fixed;inset:0;z-index:80;background:var(--cream);overflow:auto;padding:24px}
.swrap{max-width:720px;margin:0 auto;padding-bottom:40px}
.slogo{font-family:var(--serif);font-size:26px;color:var(--green-900);letter-spacing:.06em;text-align:center;margin:8px 0 2px}
.ssub{text-align:center;color:var(--ink-soft);font-size:15px;margin-bottom:26px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;margin-bottom:16px}
.step h3{margin:0 0 4px;font-size:19px;color:var(--green-900);font-weight:700}
.step p{margin:0 0 14px;font-size:14px;color:var(--ink-soft);line-height:1.6}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick button{min-width:74px;height:60px;border:2px solid var(--line-2);border-radius:12px;
  background:#fff;font-size:22px;font-weight:700;color:var(--ink)}
.pick button.on{border-color:var(--green);background:var(--green);color:#fff}
.roomin{width:100%;height:64px;border:2px solid var(--line-2);border-radius:12px;background:#fff;
  font:700 30px/1 var(--sans);letter-spacing:.28em;text-align:center;text-transform:uppercase;color:var(--green-900);
  -webkit-user-select:text;user-select:text}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{height:54px;border:1.5px solid var(--line-2);border-radius:10px;background:#fff;
  padding:0 14px;font:400 18px/1 var(--sans);color:var(--ink);-webkit-user-select:text;user-select:text}
.gobtn{width:100%;height:72px;border-radius:14px;background:var(--green);color:#fff;
  font-size:24px;font-weight:700;letter-spacing:.08em;box-shadow:0 4px 0 var(--green-900)}
.gobtn[disabled]{background:#B9B3A2;box-shadow:0 4px 0 #948E7D}

/* ---------- 頂部狀態列 ---------- */
#top{position:fixed;top:0;left:0;right:0;height:58px;z-index:40;display:flex;align-items:center;
  gap:14px;padding:0 14px;background:var(--green-900);color:#fff}
#top .mon{font-family:var(--serif);font-size:21px;letter-spacing:.04em;white-space:nowrap}
#top .ph{font-size:15px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
#top .tag{font-size:13px;opacity:.8;white-space:nowrap}
#top .dot{width:11px;height:11px;border-radius:50%;background:#7ED08F;flex:none}
#top .dot.off{background:#E0705E}
#top .menu{width:44px;height:44px;border-radius:10px;font-size:20px;opacity:.85;flex:none}

/* ---------- 斷線橫幅 ---------- */
#warn{position:fixed;top:58px;left:0;right:0;z-index:39;background:var(--brick);color:#fff;
  padding:11px 14px;font-size:16px;font-weight:600;display:none;align-items:center;gap:12px}
body.disconnected #warn{display:flex}
#warn button{margin-left:auto;background:rgba(255,255,255,.18);border-radius:8px;padding:8px 14px;
  font-size:14px;font-weight:600;color:#fff}

/* ---------- 主體 ---------- */
#app{display:none;padding:70px 14px 104px}
body.ready #app{display:block}
body.ready.disconnected #app{padding-top:118px}

/* 指令卡。刻意壓縮高度：平板 1024×768 橫放時，指令卡與 6 張學員卡要同時看得到，
   不能讓志工為了按到學員格而先捲動畫面 */
#order{border-radius:16px;padding:13px 20px 11px;margin-bottom:11px;position:relative;
  border:2px solid var(--line-2);background:var(--paper)}
#order.give{border-color:var(--green);background:var(--green-50)}
#order.take{border-color:var(--brick);background:var(--brick-50)}
#order.inv {border-color:var(--gold); background:var(--gold-50)}
.oline{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.obadge{font-size:14px;font-weight:700;letter-spacing:.1em;padding:4px 12px;border-radius:999px;
  background:var(--ink-soft);color:#fff;white-space:nowrap}
#order.give .obadge{background:var(--green)}
#order.take .obadge{background:var(--brick)}
#order.inv  .obadge{background:var(--gold-deep)}
.ostep{font-size:14px;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
/* 驗收條件：指令主文永遠 ≥32px、金額 ≥40px，最小值寫死，小平板也不會縮到看不清 */
.otitle{font-size:clamp(32px,3.4vw,42px);font-weight:800;line-height:1.32;letter-spacing:.01em}
.omoney{font-size:clamp(42px,5.4vw,64px);font-weight:800;line-height:1.08;letter-spacing:-.01em;margin:1px 0 2px;
  font-variant-numeric:tabular-nums}
#order.give .omoney{color:var(--green-900)}
#order.take .omoney{color:var(--brick-900)}
#order.inv  .omoney{color:var(--gold-deep)}
.onote{font-size:clamp(16px,1.8vw,19px);color:var(--ink);line-height:1.5;margin-top:4px}
.owhy{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line-2);
  font-size:14px;color:var(--ink-soft);line-height:1.5}
.owhy b{color:var(--ink)}
.warnbar{margin-top:8px;background:#fff;border:1.5px solid var(--gold);border-radius:10px;
  padding:8px 12px;font-size:14px;line-height:1.5;color:var(--gold-deep);font-weight:600}

/* 學員格 */
#grid{display:grid;grid-template-columns:1fr;gap:11px}
/* 常駐的六帳戶列：學員隨時要看得到自己現在有多少，不用另外點開 */
#mybal{margin-top:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:11px 13px}
#mybal h4{font-size:13px;letter-spacing:.2em;color:var(--ink-soft);font-weight:700;margin-bottom:8px}
#mybal .bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#mybal .b{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;text-align:center}
#mybal .b .l{font-size:12px;color:var(--ink-soft);white-space:nowrap}
#mybal .b .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green-900)}
#mybal .b.grow .v{color:var(--gold-deep)}
#mybal .b.neg .v{color:var(--brick)}
#mybal .sum{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
#mybal .sum b{font-size:17px;font-weight:800;color:var(--green-900);font-variant-numeric:tabular-nums}
#mybal .sum b.neg{color:var(--brick)}
@media (max-width:560px){
  #mybal .bgrid{grid-template-columns:repeat(3,1fr)}
  #mybal .b .v{font-size:17px}
}
.stu{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px 8px;
  display:flex;flex-direction:column;min-height:126px;position:relative;transition:border-color .12s,background .12s}
.stu .nm{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:700;color:var(--green-900)}
.stu .nm .idx{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink-soft);
  font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.stu .amt{font-size:clamp(29px,3.3vw,38px);font-weight:800;font-variant-numeric:tabular-nums;
  line-height:1.15;margin-top:6px;white-space:nowrap}
.stu .sub{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-top:2px;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
/* 學員版的小按鈕自成一列（見 .mini），帳本這行就不用再留右邊的位置 */
.stu .led{margin-top:auto;padding-top:7px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-soft);line-height:1.5;min-height:19px}
.stu .led .bad{color:var(--brick);font-weight:700}
.stu .led .lo{color:var(--gold-deep);font-weight:700}
.stu .hit{position:absolute;inset:0;border-radius:12px}
.stu.done{border-color:var(--green);background:var(--green-50)}
.stu.done .amt{color:var(--green-900)}
.stu.forced{border-color:var(--brick);background:var(--brick-50)}
.stu.picked{border-color:var(--gold);background:var(--gold-50)}
.stu.picked .amt{color:var(--gold-deep)}
.tick{position:absolute;top:9px;right:10px;font-size:22px;color:var(--green);font-weight:800;display:none}
.stu.done .tick{display:block}
.stu.forced .tick{display:block;color:var(--brick)}
.mini{display:flex;gap:6px;z-index:2;margin-top:9px;justify-content:flex-end;flex-wrap:wrap}
.mini button{height:34px;min-width:38px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line-2);
  background:#fff;font-size:14px;font-weight:700;color:var(--ink-soft)}
.mini button.red{border-color:var(--brick);color:var(--brick)}
.mini button.gold{border-color:var(--gold);color:var(--gold-deep)}
/* 「這筆放進哪一格」：預設那一格已經是亮的，學員沒特別說就不用點 */
.apick{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;position:relative;z-index:2}
.apick .al{font-size:12px;color:var(--ink-soft);margin-right:2px;white-space:nowrap}
.apick button{height:30px;min-width:31px;padding:0 5px;border-radius:8px;border:1.5px solid var(--line-2);
  background:#fff;font-size:13px;font-weight:700;color:var(--ink-soft)}
.apick button.on{border-color:var(--gold);background:var(--gold-50);color:var(--gold-deep)}
.apick.narrow{padding-right:0}

/* 底部固定操作列 */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;height:88px;display:flex;align-items:center;
  gap:12px;padding:0 14px;background:var(--paper);border-top:1.5px solid var(--line-2)}
#bar .back{height:60px;min-width:118px;border-radius:12px;border:2px solid var(--line-2);
  font-size:18px;font-weight:700;color:var(--ink-soft);background:#fff}
#bar .back[disabled]{opacity:.35}
#bar .mid{flex:1;text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.45}
#bar .go{height:64px;min-width:190px;padding:0 26px;border-radius:12px;background:var(--green);color:#fff;
  font-size:22px;font-weight:800;letter-spacing:.05em;box-shadow:0 4px 0 var(--green-900)}
#bar .go.ready{animation:pulse 1.5s ease-in-out infinite}
#bar .go.fin{background:var(--gold-deep);box-shadow:0 4px 0 #5F4712}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* 平板橫放常見是 1024×768，畫面高度吃緊時整體再壓一階，
   目標是「指令卡＋6 張學員卡一眼全看到，不用捲動」 */
@media (max-height:820px){
  #order{padding:10px 18px 8px;margin-bottom:9px}
  .otitle{font-size:clamp(32px,3.1vw,36px);line-height:1.25}
  .omoney{font-size:clamp(42px,4.6vw,54px)}
  .onote{font-size:16px;line-height:1.45;margin-top:3px}
  .owhy{margin-top:6px;padding-top:6px;font-size:13px}
  .warnbar{margin-top:6px;padding:7px 11px;font-size:13px}
  #grid{gap:9px}
  .stu{min-height:116px;padding:9px 11px 7px}
  #app{padding-top:66px}
}

/* 手機直式（學員自己的手機）：把平板橫式的字級壓下來，底部按鈕仍然好按 */
@media (max-width:560px){
  #order{padding:11px 13px 9px}
  .otitle{font-size:23px;line-height:1.3}
  .omoney{font-size:36px}
  .onote{font-size:15px;line-height:1.55}
  .owhy{font-size:13px}
  .stu .amt{font-size:32px}
  .stu .sub{font-size:13px;-webkit-line-clamp:4}
  #bar{height:76px;gap:8px;padding:0 10px}
  #bar .back{height:54px;min-width:76px;font-size:15px}
  #bar .go{height:56px;min-width:0;flex:1;padding:0 12px;font-size:18px}
  #bar .mid{display:none}
  #app{padding-left:11px;padding-right:11px}
}

/* 等待畫面 */
.waitbox{text-align:center;padding:44px 20px;color:var(--ink-soft)}
.waitbox .big{font-family:var(--serif);font-size:clamp(24px,3.2vw,34px);color:var(--green-900);
  margin-bottom:10px;line-height:1.45}
.waitbox .sm{font-size:16px;line-height:1.7}

/* 抽屜：學員明細／設定 */
#drawer{position:fixed;inset:0;z-index:60;background:rgba(30,28,22,.5);display:none}
#drawer.open{display:block}
.dpanel{position:absolute;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--paper);
  overflow:auto;padding:18px 18px 40px;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
.dpanel h3{margin:0 0 4px;font-size:21px;color:var(--green-900)}
.dpanel .dx{position:absolute;top:12px;right:14px;width:42px;height:42px;border-radius:10px;
  font-size:20px;color:var(--ink-soft);background:var(--cream)}
.drow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.drow .k{font-size:15px;flex:1;line-height:1.45}
.drow .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.drow .adj{display:flex;gap:6px}
.drow .adj button{width:40px;height:40px;border-radius:9px;border:1.5px solid var(--line-2);
  background:#fff;font-size:18px;font-weight:700;color:var(--ink-soft)}
.dsec{margin-top:20px;font-size:13px;letter-spacing:.14em;color:var(--ink-soft);font-weight:700}
.dbtn{width:100%;height:54px;border-radius:11px;border:2px solid var(--line-2);background:#fff;
  font-size:16px;font-weight:700;color:var(--ink);margin-top:10px}
.dbtn.red{border-color:var(--brick);color:var(--brick)}
.adot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* 分配比例：直接打數字（拉桿在平板上拉不準，2026-07-26 改掉） */
.alloc{margin-top:12px}
.alrow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.alrow .an{width:66px;flex:none;font-size:15px;font-weight:700}
.alrow .ain{width:92px;flex:none;height:50px;border-radius:10px;border:1.5px solid var(--line-2);
  background:#fff;font-size:21px;font-weight:800;text-align:center;color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.alrow .ain:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(74,124,89,.16)}
.alrow .ain::-webkit-outer-spin-button,
.alrow .ain::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.alrow .pc{flex:none;font-size:15px;font-weight:700;color:var(--ink-soft)}
.alrow .am{flex:1;min-width:0;text-align:right;font-size:14px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.ahint{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px}
.arest{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-top:8px;padding:9px 11px;
  background:var(--cream);border-radius:9px}
.arest.over{color:var(--brick);font-weight:700;background:var(--brick-50)}
.apre{display:flex;gap:9px;margin-top:12px}
.apre button{flex:1;height:48px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;
  font-size:14px;font-weight:700;color:var(--ink-soft)}
/* 「一開始就打錯了」修正模式 */
.afix{margin-top:14px;padding:11px 12px;border-radius:10px;border:1.5px dashed var(--line-2);
  font-size:13px;line-height:1.65;color:var(--ink-soft)}
.afix b{color:var(--ink)}
.afix.on{border-style:solid;border-color:#97742A;background:var(--gold-50)}
.afix button{margin-top:9px;width:100%;height:46px;border-radius:9px;border:1.5px solid #97742A;
  background:#fff;font-size:14px;font-weight:700;color:#97742A}

/* 這一局的歷程 */
.hist{margin-top:8px;max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.hrow{font-size:13px;line-height:1.55;padding:8px 11px;border-bottom:1px solid var(--line);color:var(--ink)}
.hrow:last-child{border-bottom:none}
.hrow .hm{display:inline-block;min-width:34px;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
.hrow.good{background:#F2F8F2}
.hrow.bad{background:var(--brick-50);color:var(--brick-900)}
.hrow.inv{background:var(--gold-50)}
.hrow.warn{color:var(--gold-deep)}
.hrow.fix{background:#F4F1FA}

/* 提示訊息 */
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(14px);z-index:70;
  background:var(--green-900);color:#fff;padding:13px 22px;border-radius:11px;font-size:16px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ══════════════ 開場：三步 ══════════════ -->
<div id="setup"><div class="swrap">
  <div class="slogo">視界致富羅盤・我的帳本</div>
  <div class="ssub">給無法到現場的學員用；畫面會跟著講師走</div>
  <div style="text-align:center;font-size:13px;color:var(--ink-mute);line-height:1.7;margin:-4px 0 18px">
    在教室現場的同學請用桌上的籌碼與講義，<br>由學長姐當銀行——不用開這一頁。</div>

  <div class="step">
    <h3>① 房號</h3>
    <p>講師會在台上報房號，通常就是預設的 VISION。手機要能上網才連得到講師。</p>
    <input class="roomin" id="inRoom" value="VISION" maxlength="8" autocomplete="off" spellcheck="false">
  </div>

  <div class="step">
    <h3>② 你的名字</h3>
    <p>只顯示在你自己這台，可以不填。</p>
    <div class="names" id="nmBox"></div>
  </div>

  <div class="step">
    <h3>③ 你的預算怎麼分</h3>
    <p>按下面的按鈕之後，會問你「收入進來要怎麼分到六個帳戶？」。
      <b>不分帳戶、只分兩三個都可以——照你真實的生活狀況分就好。</b></p>

<script>
/* =====================================================================
   0. 小工具
===================================================================== */
const $=s=>document.querySelector(s);
const fm=n=>{ n=Math.round(n||0); return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US'); };
const money=n=>'＄'+fm(n);
const LET='ABCDEF';
let toastT=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200);
}

/* =====================================================================
   1. 本桌帳本（存在這台裝置自己的 localStorage，斷線也不會丟）
   ---------------------------------------------------------------------
   ★ v2 起改成「純重播模擬器」：帳本只存**事實與決定**，不存任何餘額。
     每次畫面更新都從第 1 月依序重算一次，所以
       ・按「上一步」、在明細裡改任何數字 → 後面所有月份自動跟著對
       ・不可能發生重複扣款、或漏扣
   ---------------------------------------------------------------------
   alloc  ：每位學員的收入分配比例。key＝生效月份，value＝六人的比例物件（沒設定＝null）
   mlog   ：主控台每個月廣播過來的事實。key＝月份，value＝{薪水,生活費,失業,卡片,開牌,固定事件,階段}
   marks  ：每一個步驟裡組長的操作，key＝「月|階段|步驟代號」
   fixes  ：手動更正（明細裡按 +／− 改的），一筆 {r,i,k,amt}
   repay  ：主動償還投資貸款，一筆 {r,i,amt}
===================================================================== */
/* 規則改版就換鍵：舊帳本的月份表與卡片金額都不一樣，重播會算出錯的數字 */
const CKEY='zfl-student-v1';
const MAXSTU=1;      /* 學員版：這台只管你自己一個人 */
let CS=null, E=null;                       /* CS＝存下來的帳本；E＝重算出來的當下狀態 */

const ACCS  = ['life','fun','save','invest','learn','give'];
const ANAME = {life:'生活',fun:'娛樂',save:'儲蓄',invest:'投資',learn:'學習',give:'貢獻',pocket:'現金'};
const ACOLOR= {life:'#4A7C59',fun:'#C7784A',save:'#46789B',invest:'#97742A',learn:'#7C68A6',give:'#B4566B'};
/* 扣款順序：與主控台 index.html:1366 完全相同，兩端算出來的數字才會一樣 */
const PORDER= ['life','pocket','invest','save','learn','give'];
const PHS   = ['salary','allocate','event','drawn','expense'];
const PRESET= { ml:{life:0,fun:0,save:0,invest:0,learn:0,give:0},
                std:{life:60,fun:10,save:10,invest:10,learn:5,give:5} };

function newLedger(){
  return { v:1, room:'VISION', table:0, n:1, joined:false, names:['','','','','',''],
           alloc:{}, mlog:{}, marks:{}, fixes:[], repay:[],
           cur:{k:'',i:0}, finKey:'', manual:false, mRound:1, mAct:'' };
}
function z6(){ return [0,0,0,0,0,0]; }
function e6(){ return ['','','','','','']; }
/* 學員自己決定「這筆錢放進哪一格」，記在該步驟的 mark 裡（沒選過就用預設） */
function acctOf(m,i,dflt){ const k=(m&&m.acct)?m.acct[i]:''; return ACCS.indexOf(k)>=0 ? k : dflt; }
function zAcc(){ return {life:0,fun:0,save:0,invest:0,learn:0,give:0}; }
function saveCS(){ try{ localStorage.setItem(CKEY, JSON.stringify(CS)); }catch(e){} }
function loadCS(){
  /* v1 的舊帳本沒有帳戶資料，算不出正確數字，一律作廢重來（順便解掉「打開就是上一場」） */
  try{ const raw=localStorage.getItem(CKEY); if(!raw) return null;
       const o=JSON.parse(raw); return (o&&o.v===1)?o:null; }catch(e){ return null; }
}
function nameOf(i){ return (CS.names[i]||'').trim() || '你'; }

/* =====================================================================
   2. 連線：兩條腿同時走，任一條掛掉另一條照常
      ① BroadcastChannel＝跟講師同一台電腦、另開分頁時用。免網路。
      ② Supabase Realtime＝志工用自己的平板時用。走原生 WebSocket 講 Phoenix 協定，
         不載入 supabase-js，維持單檔零依賴。
      兩條線路會收到同一封包，靠 sid／seq 過濾，處理一次就好。
===================================================================== */
let TX=null, ST=null, lastRx=0, hbT=null;
const STALE_MS=20000;   /* 超過 20 秒沒收到主控的訊息＝視為斷線 */

/* 這把 anon key 只能進出廣播頻道；專案裡沒有任何資料表 */
const RT_HOST='xfxibwzmpysvyakuhdge.supabase.co';
const RT_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmeGlid3ptcHlzdnlha3VoZGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMDM0MDMsImV4cCI6MjEwMDU3OTQwM30.u0kA2XuBoQSgW7Mcf9BPlxLtLKYxwU3LUYAy6-I3Bxg';

function makeRealtimeLeg(room, onMsg, onUp){
  if(typeof WebSocket==='undefined') return null;
  const topic='realtime:wc:'+room;
  const url='wss://'+RT_HOST+'/realtime/v1/websocket?apikey='+RT_KEY+'&vsn=1.0.0';
  let ws=null, joined=false, ref=0, hb=null, miss=0, wait=null, tries=0, dead=false;
  /* 一定要先看 readyState：socket 正在關閉時 ws.send() 在 Chrome 不會丟例外，
     而是直接往 console 印紅字，try/catch 攔不到，真正的錯誤會被這種雜訊埋掉 */
  const raw=o=>{ if(!ws || ws.readyState!==1) return;
                 try{ ws.send(JSON.stringify(o)); }catch(e){} };

  function open(){
    if(dead) return;
    try{ ws=new WebSocket(url); }catch(e){ ws=null; later(); return; }
    ws.onopen=()=>{
      joined=false; miss=0;
      raw({ topic, event:'phx_join', ref:String(++ref), join_ref:'1',
            payload:{ config:{ broadcast:{self:false,ack:false}, presence:{key:''}, private:false },
                      access_token:RT_KEY } });
      clearInterval(hb);
      hb=setInterval(()=>{
        if(!ws || ws.readyState!==1) return;
        if(miss>=2){ fail(); return; }   /* 連兩次心跳沒回應＝線其實已經斷了，重連 */
        miss++; raw({ topic:'phoenix', event:'heartbeat', payload:{}, ref:String(++ref) });
      },20000);
    };
    ws.onmessage=e=>{
      let m; try{ m=JSON.parse(e.data); }catch(err){ return; }
      if(m.event==='phx_reply'){
        miss=0;
        if(m.topic===topic && m.payload && m.payload.status==='ok' && !joined){
          joined=true; tries=0; try{ onUp&&onUp(); }catch(err){}
        }
        return;
      }
      if(m.event==='broadcast'){
        if(m.payload && m.payload.payload){ try{ onMsg(m.payload.payload); }catch(err){} }
        return;
      }
      if(m.event==='phx_error' || m.event==='phx_close') fail();
    };
    ws.onerror=()=>{};
    ws.onclose=()=>fail();
  }
  function fail(){
    joined=false; clearInterval(hb); hb=null;
    if(ws){ try{ ws.onclose=null; ws.onmessage=null; ws.close(); }catch(e){} ws=null; }
    later();
  }
  function later(){   /* 退避重連：0.7→1.4→2.8→5.6→8 秒，加亂數避免五台平板同時湧上 */
    if(dead || wait) return;
    wait=setTimeout(()=>{ wait=null; open(); },
      Math.min(8000, 700*Math.pow(2, Math.min(tries++,4))) + Math.random()*300);
  }
  open();
  return { kind:'rt', up:()=>joined,
    send:o=>{ if(joined) raw({ topic, event:'broadcast', ref:String(++ref),
                               payload:{ type:'broadcast', event:'msg', payload:o } }); },
    /* 平板睡醒、WiFi 剛回來時立刻重連，不用等退避倒數 */
    poke:()=>{ if(dead||joined) return;
               if(ws && ws.readyState===0) return;     /* 正在連，別打斷它 */
               clearTimeout(wait); wait=null; tries=0; clearInterval(hb); hb=null;
               if(ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; }
               open(); },
    close:()=>{ dead=true; clearInterval(hb); clearTimeout(wait);
                if(ws){ try{ ws.onclose=null; ws.close(); }catch(e){} ws=null; } } };
}

function makeTransport(room, onMsg, onUp){
  const legs=[];
  if(typeof BroadcastChannel!=='undefined'){
    try{
      const ch=new BroadcastChannel('wc:'+room);
      ch.onmessage=e=>{ try{ onMsg(e.data); }catch(err){} };
      legs.push({ kind:'bc', up:()=>true, poke:()=>{},
                  send:o=>{ try{ ch.postMessage(o); }catch(err){} },
                  close:()=>{ try{ ch.close(); }catch(err){} } });
    }catch(e){}
  }
  const rt=makeRealtimeLeg(room, onMsg, onUp);
  if(rt) legs.push(rt);
  if(!legs.length) return null;
  const poke=()=>legs.forEach(l=>{ try{ l.poke(); }catch(e){} });
  const onWake=()=>{ if(!document.hidden) poke(); };
  addEventListener('online', poke);
  document.addEventListener('visibilitychange', onWake);
  return {
    send:o=>legs.forEach(l=>{ try{ l.send(o); }catch(e){} }),
    net:()=>legs.some(l=>l.kind==='rt' && l.up()),   /* 跨裝置那條通了沒 */
    poke,
    close:()=>{ removeEventListener('online', poke);
                document.removeEventListener('visibilitychange', onWake);
                legs.forEach(l=>{ try{ l.close(); }catch(e){} }); } };
}
function connect(){
  if(TX){ TX.close(); TX=null; }
  TX=makeTransport(CS.room, onMsg, ()=>{ hello(); });   /* 網路一接通就報到，立刻要一份完整狀態 */
  if(!TX){ toast('這個瀏覽器不支援自動連線，已切到手動模式'); goManual(); return; }
  hello();
  clearInterval(hbT);
  hbT=setInterval(()=>{ report(); checkLink(); }, 4000);
  checkLink();
}
/* table:0＝學員台。講師的「各桌進度」面板只列第 1～5 桌（志工），
   所以學員連進來不會佔位；主控端收到 hello 會補一份完整狀態給我們。 */
function hello(){ if(TX) TX.send({t:'hello', table:0}); }
function onMsg(m){
  if(!m || m.t!=='state') return;
  /* 兩條線路會各送一份同樣的封包，處理一次就好；
     講師重整頁面後 seq 會歸零，所以要連 sid 一起看，否則新封包會被誤判成舊的。 */
  if(ST && m.sid===ST.sid && m.seq && ST.seq && m.seq <= ST.seq) return;
  ST=m; lastRx=Date.now();
  CS.manual=false;
  checkLink();      /* 一收到訊息就把紅色橫幅收掉，不用等 4 秒心跳 */
  applyState();
}
/* 學員台刻意不回報進度：一班三十個人各報一次，會把講師的「各桌進度」洗掉。 */
function report(){}
function checkLink(){
  const off = !CS.manual && (!ST || Date.now()-lastRx > STALE_MS);
  document.body.classList.toggle('disconnected', off);
  $('#tDot').classList.toggle('off', off || CS.manual);
  if(!ST && !CS.manual){
    $('#warnTxt').textContent='⚠ 還沒連上講師（請確認房號，並等講師開啟連線）';
  }else{
    $('#warnTxt').textContent='⚠ 和講師失去連線，正在重新連上（你的帳本都還在，可以繼續記）';
  }
}
/* 始終連不上時的退路：手動選月份，自己挑要做的事 */
function goManual(){
  CS.manual=true; document.body.classList.remove('disconnected');
  saveCS(); openDrawer('manual');
}

/* =====================================================================
   3. 帳本計算
===================================================================== */
const N=()=>CS.n;
/* 主控台沒連上時的備援數值。連上之後一律以廣播的 ST.nums 為準（講師臨場改參數也跟著變） */
function defNums(){
  return { stressCost:30000, marryExtra:5000, inflationExtra:5000, knowUnit:1000,
           joblessSaveCost:10000, charityUnit:1000, giveBoost:10,
           charityCover:50000, accidentCost:300000, unlockFee:2000, unlockFeeLearn:500 };
}
function nums(){
  return Object.assign(defNums(), (ST&&ST.nums)||{});
}
function loanUnit(){ return (ST&&ST.loan&&ST.loan.unit)||10000; }
function loanRate(){ return ((ST&&ST.loan&&ST.loan.ratePct)||10)/100; }
function loanCapX(){ return (ST&&ST.loan&&ST.loan.capX)||10; }
function funPer(){ return (ST&&ST.fun&&ST.fun.per)||2000; }
function funCover(){ return (ST&&ST.fun&&ST.fun.cover)||10000; }
function curRound(){ return CS.manual ? CS.mRound : ((ST&&ST.round)||0); }

/* ---------------------------------------------------------------------
   分配比例：key＝「從第幾月開始生效」。開場（或第 1 月）設定的寫進 alloc[1]；
   第 4、8 月的重分配窗口設定的比例，從下個月才生效（寫進 r+1）。
--------------------------------------------------------------------- */
function allocOf(i,r){
  for(let m=r;m>=1;m--){ const a=CS.alloc[m]; if(a && a[i]) return a[i]; }
  return zAcc();                                   /* 從沒設定過＝月光族，全部 0 */
}
function allocIsSet(i,r){ const a=CS.alloc[r]; return !!(a && a[i]); }
/* 問過了沒？（選「不分帳戶」也算問過，六格全 0 不能當成沒問） */
function allocKnown(i,r){
  for(let m=Math.max(1,r);m>=1;m--){ const a=CS.alloc[m]; if(a && a[i]) return true; }
  return false;
}
/* 這一位在第 r 月之後，自己還有沒有另外調過比例 */
function allocLaterThan(i,r){
  for(let m=r+1;m<=12;m++){ const a=CS.alloc[m]; if(a && a[i]) return m; }
  return 0;
}
function allocSum(a){ return ACCS.reduce((s,k)=>s+(a[k]||0),0); }
function allocCount(a){ return ACCS.filter(k=>(a[k]||0)>0).length; }
function setAllocAt(i,r,obj){
  if(!CS.alloc[r]) CS.alloc[r]=[null,null,null,null,null,null];
  CS.alloc[r][i]=obj; saveCS();
}

/* ---------------------------------------------------------------------
   主控台廣播過來的「事實」記進 mlog。這是重播的唯一輸入來源，
   組長的操作則在 marks 裡；兩者相加就能算出任何一個月的完整狀態。
--------------------------------------------------------------------- */
function absorbState(){
  if(!ST || !ST.started) return;
  const r=ST.round; if(r<1 || r>ST.rounds) return;
  const old=CS.mlog[r]||{};
  const ph=Math.max(0, PHS.indexOf(ST.phase));
  /* 通膨（第 4 月）與結婚生子（第 8 月）已改成「付固定支出之前」漲，
     當月付的就是新金額，所以生活費直接用主控台廣播的現值，不再沿用舊數字。 */
  const expense = ST.expense;
  CS.mlog[r]={
    income:ST.income, expense, jobless:!!ST.jobless,
    card: ST.card || old.card || null,
    settle: (ST.settle && ST.settle.length) ? ST.settle : (old.settle||[]),
    fixed: (ST.fixed && ST.fixed.length) ? ST.fixed : (old.fixed||[]),
    nums: ST.nums||null, rate:loanRate(), unit:loanUnit(), capX:loanCapX(),
    per:funPer(), cover:funCover(),
    ph                                             /* 講師目前推進到第幾個階段 */
  };
}
/* 手動模式：連不上主控時，用預設值自己補一筆事實，帳照樣算得下去 */
function absorbManual(){
  const r=CS.mRound; if(r<1||r>12) return;
  const o=CS.mlog[r];
  if(!o) CS.mlog[r]={ income:50000, expense:30000, jobless:false, card:null,
                      settle:[], fixed:[], nums:null, rate:.1, unit:10000, capX:10,
                      per:2000, cover:10000, ph:4 };
}
function maxRound(){
  let m=0; for(const k in CS.mlog){ const r=+k; if(r>m) m=r; } return m;
}
function markGet(r,ph,id){
  const m=CS.marks[r+'|'+ph+'|'+id];
  if(!m) return { tick:z6(), cnt:z6(), loan:z6(), acct:e6() };
  if(!m.acct) m.acct=e6();          /* 舊帳本補上新欄位 */
  return m;
}

/* 某筆投資開牌後，本金是否還留著（＝還算在投資總額裡）
   開牌後仍有配息／新增現金流的就是長期持有；純還本或血本無歸的就結束了 */
function stillHeld(h){
  if(!h.st) return true;
  if(h.st.dead) return false;
  if((h.st.keepCf||0)+(h.st.addCf||0)+(h.st.extraCf||0) > 0) return true;
  return !h.st.backPrincipal;
}
/* 第 i 位學員在第 r 月的每月被動收入（投資配息，失業月照領） */
function passiveOf(i,r,hold){
  const H=hold||(E&&E.hold)||{}; let s=0;
  for(const k in H){ const h=H[k]; const u=h.units[i]||0;
    if(!u || h.buy>=r) continue;                       /* 買進的當月不配息，次月起才有 */
    if(h.st && r>h.st.round) s += u*((h.st.keepCf||0)+(h.st.addCf||0));
    else s += u*(h.cf||0);
  }
  return s;
}
/* 知識變現換來的每月收入。屬於「主動收入」，停薪月跟薪水一起停，復工才領得到。 */
function knowOf(i,X){ const S=X||E; return S ? (S.other[i]||0) : 0; }
/* 投資帶來的每月現金流（創業分潤等）。不是公司給的，停薪月照領。 */
function invCfOf(i,r,X){
  const S=X||E; if(!S) return 0; let s=0;
  for(const k in S.hold){ const h=S.hold[k]; const u=h.units[i]||0;
    if(u && h.st && r>h.st.round) s += u*(h.st.extraCf||0);
  }
  return s;
}
/* 兩者合計（結算、調整面板等「看總額」的地方用） */
function otherOf(i,r,X){ return knowOf(i,X)+invCfOf(i,r,X); }
/* 這個月實際發得出來的其他收入：停薪月扣掉知識變現 */
function otherPayOf(i,r,X,jl){ return (jl?0:knowOf(i,X)) + invCfOf(i,r,X); }
/* 第 i 位學員手上還留著的投資總額（本金） */
function assetOf(i,X){
  const S=X||E; if(!S) return 0; let s=0;
  for(const k in S.hold){ const h=S.hold[k];
    if(stillHeld(h)) s += (h.units[i]||0)*h.price; }
  return s;
}
function debtOf(i){ return E ? (E.loan[i]||0)+(E.debt[i]||0) : 0; }
function interestOf(i){ return Math.round(debtOf(i)*loanRate()); }
function cashOf(i,X){ const S=X||E; return S ? ACCS.reduce((s,k)=>s+S.A[i][k],0)+S.pocket[i]+S.incoming[i] : 0; }
/* count 模式最多能點幾份：一般只看指定帳戶；公益（alsoCash）可以再用其他的錢往上加 */
function countCap(i,st,D,now){
  const avail=D?(D.avail||0):0;
  const pool=avail + (st.alsoCash ? Math.max(0, cashOf(i)-avail) : 0);
  return Math.floor(pool/st.unitAmt)+(now||0);
}
function netOf(i){ return cashOf(i)+assetOf(i)-debtOf(i); }
function flowOf(i){
  if(!E) return 0;
  /* 12 個月跑完後 ST.round 會變成 13，那個月沒有任何事實可查，
     薪水與生活費會被當成 0，結算畫面的「每月淨現金流」就會少算一整段。
     結算要比的本來就是最後一個月的現金流，所以往回抓最後一筆有紀錄的月份。 */
  const r=Math.min(curRound()||1, maxRound()||1) || 1;
  const jl = (CS.mlog[r]&&CS.mlog[r].jobless);
  const act = (jl?0:(CS.mlog[r]&&CS.mlog[r].income||0)) + otherOf(i,r+1);
  const exp = (CS.mlog[r]&&CS.mlog[r].expense)||0;
  return act + passiveOf(i,r+1) - exp - interestOf(i);
}

/* =====================================================================
   3-B. 重播引擎
   ---------------------------------------------------------------------
   從第 1 月開始，把「主控廣播的事實」＋「組長的操作」依序套用一次，
   算出每位學員此刻的六個帳戶、負債、持有投資與完整歷程。
   全部都是重算出來的，沒有任何累加狀態，所以怎麼改都不會錯。
===================================================================== */
function freshE(){
  const A=[],log=[];
  for(let i=0;i<MAXSTU;i++){ A.push(zAcc()); log.push([]); }
  return { A, pocket:z6(), incoming:z6(), loan:z6(), debt:z6(), other:z6(), donated:z6(),
           incTot:z6(), hold:{}, log, det:{}, mlOn:false };
}
function elog(X,i,r,t,c){ X.log[i].push({r,t,c:c||''}); }

/* 扣款鏈：生活→現金→投資→儲蓄→學習→貢獻，不夠就記被迫負債。
   回傳一份明細，畫面直接拿去顯示——螢幕上寫的就是引擎真的算的，不可能對不上。 */
/* 投資賠錢先掏投資帳戶（投資的事只能用投資的錢），掏不夠才走一般扣款鏈、最後被迫負債 */
function payInvestFirst(X,i,amt,label,r,mm,chAcc){
  const use=Math.min(X.A[i].invest, Math.round(amt));
  if(use>0){ X.A[i].invest-=use; elog(X,i,r,`${label}：投資帳戶付 ${fm(use)}`,'bad'); }
  const rest=Math.round(amt)-use;
  if(rest<=0) return { amt:Math.round(amt), used:[{k:'invest',use}], borrowed:0, short:0 };
  const d=payFrom(X,i,rest,label,r,true,mm,chAcc);
  d.amt=Math.round(amt);
  if(use>0) d.used=[{k:'invest',use}].concat(d.used||[]);
  return d;
}
function payFrom(X,i,amt,label,r,borrow,mm,chAcc){
  let need=Math.round(amt); const used=[];
  for(const k of PORDER){
    if(need<=0) break;
    const bal = k==='pocket'?X.pocket[i]:X.A[i][k];
    const use = Math.min(bal,need);
    if(use>0){
      if(k==='pocket') X.pocket[i]-=use; else X.A[i][k]-=use;
      need-=use; used.push({k,use});
    }
  }
  if(need>0 && X.incoming[i]>0){
    const u=Math.min(X.incoming[i],need);
    X.incoming[i]-=u; need-=u; used.push({k:'incoming',use:u});
  }
  const det={ amt:Math.round(amt), used, borrowed:0, short:need };
  if(used.length){
    const from=used.map(u=>(ANAME[u.k]||'待分配')+' '+fm(u.use)).join('、');
    elog(X,i,r,`${label} ${fm(amt)}　←　${from}`);
  }
  if(borrow===false || need<=0){
    if(need>0 && borrow===false) elog(X,i,r,`${label} 還差 ${fm(need)} 付不出來`,'bad');
    return det;
  }
  const U=(mm&&mm.unit)||10000;
  const units=Math.ceil(need/U), got=units*U;
  X.debt[i]+=got;
  /* 借來付帳單，多出來的零頭由學員自己決定放哪一格（預設生活帳戶） */
  const change=got-need;
  const acc=ACCS.indexOf(chAcc)>=0 ? chAcc : 'life';
  if(change>0) X.A[i][acc]+=change;
  det.borrowed=got; det.short=need; det.change=change; det.changeAcc=acc;
  elog(X,i,r,`${label} 付不出來 → 被迫負債 ${fm(got)}（${units} 個 ${fm(U)}，月息 ${Math.round(((mm&&mm.rate)||.1)*100)}%）`
    +(change>0?`；找零 ${fm(change)} 放進${ANAME[acc]}帳戶`:''),'bad');
  return det;
}
/* 按比例分流一筆收入（發薪、好消息卡共用） */
function spread(X,i,r,inc){
  const al=allocOf(i,r); let sum=0;
  if(allocSum(al)<=0){ X.pocket[i]+=inc; return {al,parts:[],rest:inc}; }
  const parts=[];
  ACCS.forEach(k=>{ const a=Math.floor(inc*(al[k]||0)/100); if(a>0){ X.A[i][k]+=a; parts.push({k,a}); } sum+=a; });
  X.pocket[i]+=inc-sum;
  return {al,parts,rest:inc-sum};
}

/* 從第 1 月重新算一次。畫面每次更新都會呼叫，成本極低（6 人 ×12 月）。 */
function recompute(){
  const X=freshE(), last=maxRound();
  for(let r=1;r<=last;r++){
    const f=CS.mlog[r]; if(!f) continue;
    const upto=(typeof f.ph==='number')?f.ph:4;
    /* when==='pre' 的固定事件排在發薪之前（第 7 月知識變現：換完才算得出這個月主動收入是多少） */
    if(upto>=0){
      const nm=Object.assign(defNums(), f.nums||{});
      (f.fixed||[]).filter(x=>x.when==='pre').forEach(fx=>phFixed(X,r,f,fx,nm));
      phSalary(X,r,f);
    }
    if(upto>=1) phAllocate(X,r,f);
    if(upto>=3) phDrawn(X,r,f);
    if(upto>=4) phExpense(X,r,f);
    applyFixes(X,r);
  }
  return X;
}
function applyFixes(X,r){
  (CS.repay||[]).forEach(p=>{
    if(p.r!==r) return;
    const pay=Math.min(p.amt, X.loan[p.i]); if(pay<=0) return;
    const d=payFrom(X,p.i,pay,'償還投資貸款',r,false,CS.mlog[r]);
    X.loan[p.i]-=(pay-d.short);
  });
  (CS.fixes||[]).forEach(fx=>{
    if(fx.r!==r) return;
    if(ACCS.indexOf(fx.k)>=0) X.A[fx.i][fx.k]=Math.max(0,X.A[fx.i][fx.k]+fx.amt);
    else if(fx.k==='pocket') X.pocket[fx.i]=Math.max(0,X.pocket[fx.i]+fx.amt);
    else if(X[fx.k]) X[fx.k][fx.i]=Math.max(0,X[fx.k][fx.i]+fx.amt);
    elog(X,fx.i,r,`人工更正：${ANAME[fx.k]||fx.k} ${fx.amt>0?'+':''}${fm(fx.amt)}`,'fix');
  });
}

/* ── 階段①　發薪＋開牌 ─────────────────────────────────────── */
function phSalary(X,r,f){
  const det=[];
  for(let i=0;i<MAXSTU;i++){
    const pas=passiveOf(i,r,X.hold), oth=otherPayOf(i,r,X,f.jobless);  /* 停薪月只剩投資現金流 */
    const act=f.jobless?0:(f.income||0);
    const inc=act+oth+pas;
    X.incoming[i]=inc; X.incTot[i]=inc;
    det.push({amt:inc, act, oth, pas});
    if(inc>0) elog(X,i,r,`領到 ${fm(inc)}（薪水 ${fm(act)}＋其他 ${fm(oth)}＋配息 ${fm(pas)}）`,'good');
    else elog(X,i,r,'這個月一毛都沒領到','bad');
  }
  X.det[r+'|salary|salary']=det;
  (f.settle||[]).forEach(s=>{
    const h=X.hold[s.id]; if(!h) return;
    h.st={ round:r, perUnit:s.perUnit||0, dead:!!s.dead, backPrincipal:!!s.backPrincipal,
           addCf:s.addCf||0, extraCf:s.extraCf||0, keepCf:s.keepCf||0,
           owePerUnit:s.owePerUnit||0, gmPct:s.gmPct||0 };
    const d2=[];
    for(let i=0;i<MAXSTU;i++){
      const u=h.units[i]||0;
      if(!u){ d2.push({amt:0,u:0}); continue; }
      if(s.dead){
        /* 股災②抽到負數：本金歸零之外還要再賠，先掏投資帳戶，掏不夠就被迫負債 */
        const owe=u*(s.owePerUnit||0);
        elog(X,i,r,`${s.title} 開牌：投的 ${fm(u*h.price)} 本金歸零`,'bad');
        let dd={amt:0,u,owe:0};
        if(owe>0) dd=Object.assign(payInvestFirst(X,i,owe,`${s.title}・追繳虧損`,r,f,acctOf(markGet(r,'salary','st_'+s.id),i,'life')),{amt:0,u,owe});
        d2.push(dd);
      }
      else{
        /* 開牌拿到的錢，由學員自己決定進哪一格（預設投資帳戶）——規則第 3 頁講的那條 */
        const pay=u*(s.perUnit||0);
        const acc=acctOf(markGet(r,'salary','st_'+s.id),i,'invest');
        X.A[i][acc]+=pay; d2.push({amt:pay,u,owe:0,acc});
        elog(X,i,r,`${s.title} 開牌：${u} 單位 × ${fm(s.perUnit)} ＝ ${fm(pay)} 進${ANAME[acc]}帳戶`,'good');
      }
    }
    X.det[r+'|salary|st_'+s.id]=d2;
  });
}

/* ── 階段②　分配收入 ───────────────────────────────────────── */
function phAllocate(X,r,f){
  const det=[];
  for(let i=0;i<MAXSTU;i++){
    const inc=X.incoming[i]; X.incoming[i]=0;
    if(inc<=0){ det.push({inc:0,parts:[],rest:0,al:allocOf(i,r)}); continue; }
    const sp=spread(X,i,r,inc);
    det.push({inc, parts:sp.parts, rest:sp.rest, al:sp.al});
    elog(X,i,r, sp.parts.length
      ? `分配 ${fm(inc)}：${sp.parts.map(p=>ANAME[p.k]+' '+fm(p.a)).join('、')}${sp.rest>0?'、現金 '+fm(sp.rest):''}`
      : `沒有分帳戶，${fm(inc)} 全部放身上`, sp.parts.length?'':'warn');
  }
  X.det[r+'|allocate|alloc']=det;
}

/* ── 階段③　事件卡 ─────────────────────────────────────────── */
function phDrawn(X,r,f){
  const c=f.card; if(!c) return;
  const nm=Object.assign(defNums(), f.nums||{});
  /* 投資機會 */
  if(c.unit>0){
    const m=markGet(r,'drawn','card_'+c.id), det=[];
    const h=X.hold[c.id] || (X.hold[c.id]={title:c.title,price:c.unit,cf:c.cf||0,buy:r,units:z6(),st:null});
    h.price=c.unit; h.cf=c.cf||0;
    for(let i=0;i<MAXSTU;i++){
      const avail=X.A[i].invest;
      const u=m.cnt[i]||0;
      h.units[i]=u;
      if(!u){ det.push({u:0,avail,cost:0,borrowed:0}); continue; }
      const cost=u*c.unit;
      const want=m.loan[i]||0;
      const borrowed=Math.min(want, cost);
      /* 借的比這張投資貴（最多多一個單位，bumpLoan 有擋），多出來的錢學員自己決定放哪一格 */
      const spare=want-borrowed;
      const spareAcc=acctOf(m,i,'invest');
      const fromAcc=Math.min(X.A[i].invest, cost-borrowed);
      X.A[i].invest-=fromAcc; X.loan[i]+=want;
      if(spare>0) X.A[i][spareAcc]+=spare;
      det.push({u,avail,cost,borrowed,fromAcc,spare,spareAcc});
      elog(X,i,r,`投資「${c.title}」${c.one?`一筆 ${fm(cost)}`:`${u} 單位 ＝ ${fm(cost)}`}`
        +(borrowed?`（其中 ${fm(borrowed)} 是跟銀行借的）`:'')
        +(spare>0?`；多借的 ${fm(spare)} 放進${ANAME[spareAcc]}帳戶`:''),'inv');
    }
    if(!h.units.some(u=>u>0)) delete X.hold[c.id];
    X.det[r+'|drawn|card_'+c.id]=det;
    return;
  }
  /* 好消息：發錢，照分配比例分流 */
  if(c.amt>0){
    const det=[];
    for(let i=0;i<MAXSTU;i++){
      const sp=spread(X,i,r,c.amt);
      det.push({amt:c.amt, parts:sp.parts, rest:sp.rest});
      elog(X,i,r,`${c.title} ＋${fm(c.amt)}`,'good');
    }
    X.det[r+'|drawn|card_'+c.id]=det; return;
  }
  /* 支出：大額消費可用娛樂帳戶抵扣 */
  if(c.amt<0){
    const cost=-c.amt, off=(c.kind==='bigspend'), det=[];
    const mk=markGet(r,'drawn','card_'+c.id);
    for(let i=0;i<MAXSTU;i++) det.push(takeWithFun(X,i,r,cost,c.title,off,f,acctOf(mk,i,'life')));
    X.det[r+'|drawn|card_'+c.id]=det;
  }
}
/* 收一筆錢，需要時先用娛樂帳戶折抵（規則與主控台 index.html:1467 相同） */
function takeWithFun(X,i,r,cost,label,useFun,f,chAcc){
  const per=(f&&f.per)||2000, cov=(f&&f.cover)||10000;
  let covered=0, chunks=0;
  if(useFun){
    chunks=Math.min(Math.floor(X.A[i].fun/per), Math.ceil(cost/cov));
    covered=Math.min(cost, chunks*cov);
    if(chunks>0){ X.A[i].fun-=chunks*per;
      elog(X,i,r,`${label}：娛樂帳戶 ${fm(chunks*per)} 折抵 ${fm(covered)}`,'good'); }
  }
  const rest=cost-covered;
  if(rest<=0){ elog(X,i,r,`${label}：娛樂預算全額抵銷，一毛不用付`,'good');
               return {amt:0, full:cost, covered, chunks, used:[], borrowed:0, short:0}; }
  const d=payFrom(X,i,rest,label,r,true,f,chAcc);
  return Object.assign(d,{full:cost, covered, chunks});
}

/* ── 階段④　繳生活費＋月底固定事件 ─────────────────────────── */
function phExpense(X,r,f){
  const nm=Object.assign(defNums(), f.nums||{});
  const det=[];
  for(let i=0;i<MAXSTU;i++){
    let d;
    /* 停薪月：儲蓄帳戶付得出 joblessSaveCost 就免掉當月生活費（與主控台 demoExpense 同一條規則） */
    if(f.jobless && X.A[i].save>=nm.joblessSaveCost){
      X.A[i].save-=nm.joblessSaveCost;
      d={amt:0, waived:nm.joblessSaveCost, used:[{k:'save',use:nm.joblessSaveCost}], borrowed:0, short:0};
      elog(X,i,r,`停薪月：用儲蓄 ${fm(nm.joblessSaveCost)} 換掉這個月的生活費 ${fm(f.expense)}`,'good');
    }else{
      d=payFrom(X,i,f.expense||0,'生活費',r,true,f,acctOf(markGet(r,'expense','expense'),i,'life'));
    }
    /* 欠款利息：繳不出來的部分滾入本金 */
    const dt=X.loan[i]+X.debt[i];
    if(dt>0){
      const it=Math.round(dt*((f.rate)||.1));
      const d2=payFrom(X,i,it,'欠款利息',r,false,f);
      if(d2.short>0){ X.debt[i]+=d2.short; elog(X,i,r,`利息還差 ${fm(d2.short)}，滾入本金`,'bad'); }
      d.interest=it; d.intUsed=d2.used;
    }
    /* 手頭寬裕就自動把「被迫負債」清掉；投資貸款是他自己的選擇，不替他還 */
    if(X.debt[i]>0 && cashOf(i,X)>=X.debt[i]+(f.expense||0)){
      const was=X.debt[i];
      const d3=payFrom(X,i,was,'清償被迫負債',r,false,f);
      X.debt[i]=d3.short;
      if(d3.short<was) elog(X,i,r,`資金充裕，清掉被迫負債 ${fm(was-d3.short)}`,'good');
    }
    det.push(d);
  }
  X.det[r+'|expense|expense']=det;
  (f.fixed||[]).filter(fx=>fx.when!=='pre').forEach(fx=>phFixed(X,r,f,fx,nm));
  /* 月底：無意識消費（第 2 月起，帳戶數不足 2 的人現金＋生活帳戶歸零） */
  if(X.mlOn){
    for(let i=0;i<MAXSTU;i++){
      if(allocCount(allocOf(i,r))>=2) continue;
      const gone=X.pocket[i]+X.A[i].life;
      if(gone>0) elog(X,i,r,`無意識消費：沒有分帳戶 → 現金＋生活帳戶 ${fm(gone)} 全數消失`,'bad');
      X.pocket[i]=0; X.A[i].life=0;
    }
  }
}
function phFixed(X,r,f,fx,nm){
  /* 月初事件顯示在發薪階段，marks／det 的鍵要跟著走，不然畫面上點的份數會對不到引擎算的 */
  const ph = fx.when==='pre' ? 'salary' : 'expense';
  const key=r+'|'+ph+'|fx_'+fx.id, m=markGet(r,ph,'fx_'+fx.id), det=[];
  switch(fx.id){
    case 'mindless':
      X.mlOn=true;
      for(let i=0;i<MAXSTU;i++) det.push({poor:allocCount(allocOf(i,r))<2});
      break;
    case 'stress':
      for(let i=0;i<MAXSTU;i++) det.push(takeWithFun(X,i,r,nm.stressCost,'報復性消費',true,f,acctOf(m,i,'life')));
      break;
    case 'know':
      for(let i=0;i<MAXSTU;i++){
        const avail=X.A[i].learn, u=m.cnt[i]||0, amt=u*nm.knowUnit;
        if(amt>0){ X.A[i].learn-=Math.min(amt,X.A[i].learn); X.other[i]+=amt;
          elog(X,i,r,`知識變現：學習帳戶 ${fm(amt)} 換成每月主動收入 +${fm(amt)}（停薪月不發，復工才領）`,'good'); }
        det.push({u,avail,amt});
      }
      break;
    case 'charity':
      /* 貢獻帳戶付得起的份數算 ×giveBoost 捐款額，超出的份數用其他的錢付、只算 1:1 */
      for(let i=0;i<MAXSTU;i++){
        const avail=X.A[i].give, u=m.cnt[i]||0, amt=u*nm.charityUnit;
        const boost=nm.giveBoost||1;
        const fromGive=Math.min(amt, Math.floor(avail/nm.charityUnit)*nm.charityUnit);
        const fromCash=amt-fromGive;
        const d={u,avail,amt,fromGive,fromCash,credit:0,used:[],borrowed:0,short:0};
        if(fromGive>0){ X.A[i].give-=fromGive; d.credit+=fromGive*boost; d.used.push({k:'give',use:fromGive}); }
        if(fromCash>0){
          const p=payFrom(X,i,fromCash,'公益捐款（現金）',r,false,f);
          d.credit+=fromCash-p.short; d.used=d.used.concat(p.used||[]); d.short=p.short;
        }
        if(d.credit>0){ X.donated[i]+=d.credit;
          elog(X,i,r,`公益捐款 ${fm(amt-d.short)}${fromGive?`（貢獻帳戶 ${fm(fromGive)} ×${boost}）`:''}${fromCash?`＋現金 ${fm(fromCash-d.short)}`:''} → 捐款額 ${fm(d.credit)}（累計 ${fm(X.donated[i])}）`,'good'); }
        det.push(d);
      }
      break;
    case 'accident':
      for(let i=0;i<MAXSTU;i++){
        const keep=Math.min(nm.accidentCost, Math.floor(X.donated[i]/nm.charityUnit)*nm.charityCover);
        const need=Math.max(0, nm.accidentCost-keep);
        if(keep>0) elog(X,i,r,`重大事故：捐款額 ${fm(X.donated[i])} → 貴人相助保留 ${fm(keep)}`,'good');
        det.push(need>0 ? Object.assign(payFrom(X,i,need,'重大事故',r,true,f,acctOf(m,i,'life')),{keep})
                        : {amt:0,keep,used:[],borrowed:0,short:0});
      }
      break;
    case 'inflation':
      /* 這個月不用動錢，下個月起生活費變貴——金額由主控台廣播，副控不自己加 */
      for(let i=0;i<MAXSTU;i++) det.push({});
      break;
    case 'realloc': {
      /* 第一次開放重分配要付學習費；只跟真的重新設定的人收。
         學習帳戶付得起就自動走兩折價，這是規則給「平時有投資自己」的人的好處 */
      const first=!X.reDone; X.reDone=true;
      const cheap=nm.unlockFeeLearn||nm.unlockFee;
      for(let i=0;i<MAXSTU;i++){
        const changed=allocIsSet(i,r+1);
        if(!(first&&changed)){ det.push({changed, fee:0}); continue; }
        if(X.A[i].learn>=cheap){
          X.A[i].learn-=cheap;
          elog(X,i,r,`預算重分配：用學習帳戶付 ${fm(cheap)}（平時有投資自己，學費打兩折）`,'good');
          det.push({changed, fee:cheap, byLearn:true, used:[{k:'learn',use:cheap}], borrowed:0, short:0, amt:cheap});
        }else{
          det.push(Object.assign(payFrom(X,i,nm.unlockFee,'預算重分配學習費',r,true,f),{changed,fee:nm.unlockFee}));
        }
      }
      break;
    }
    default:
      for(let i=0;i<MAXSTU;i++) det.push({});
  }
  X.det[key]=det;
}

/* =====================================================================
   4. 本月步驟表
   ---------------------------------------------------------------------
   副控台不自己決定要發生什麼事，一律照主控台廣播的階段走。
   每個階段拆成一到數個步驟，畫面一次只顯示一個步驟。
   mode：give＝發錢給學員（綠）／take＝跟學員收錢（紅）
         units＝投資點單位（金）／count＝點數量（知識變現、捐款）
         check＝只要逐人確認／info＝純告知，不用動錢
===================================================================== */
function buildSteps(){
  if(CS.manual) return manualSteps();
  /* 講師還沒開始 → 這段時間拿來把每個人的分配比例問完（命名之後的第一件事） */
  if(!ST || !ST.started) return [setupAllocStep()];
  const r=ST.round, out=[];
  if(ST.round>ST.rounds) return [{ id:'final', mode:'info', badge:'結束',
    title:'12 個月跑完了', note:'下面是你的淨資產與每月淨現金流。點一下可以打開這 12 個月的完整歷程。',
    why:'最後要比的是淨資產和每月淨現金流，不是誰手上現金多。' }];

  switch(ST.phase){
    case 'salary': {
      /* 分配比例排在發薪前面（2026-07-26 改）：先確認這個月的錢會怎麼分，
         發錢時就能直接照帳戶把籌碼一次發對，不用發完再退回來重擺。
         主控台沒有獨立的「分配」階段，錢一律在講師推進到下一階段時才真正入帳。 */
      /* 月初事件（第 7 月知識變現）要先做完，這個月該發多少主動收入才算得出來 */
      (ST.fixed||[]).filter(f=>f.when==='pre').forEach(f=>out.push(fixedStep(f,r)));
      out.push(allocStep(r));
      out.push(salaryStep(r));
      (ST.settle||[]).forEach(s=>out.push(settleStep(s,r)));
      break;
    }
    case 'allocate':
      out.push(allocStep(r));
      break;
    case 'event':
      out.push({ id:'wait', mode:'info', badge:'等一下',
        title:'等講師翻開這個月的事件卡',
        note:'卡片翻開後，這裡會自動告訴你要收多少或發多少。',
        why:'事件由講師統一翻牌，全班一起結算，才不會有人搶快。' });
      break;
    case 'drawn': {
      const c=ST.card;
      if(c) out.push(cardStep(c,r));
      else out.push({ id:'nocard', mode:'info', badge:'這個月', title:'這個月沒有要結算的事件',
        note:'等講師繼續往下走。', why:'' });
      break;
    }
    case 'expense': {
      /* 通膨／結婚生子先講（生活費當月就變貴了），再收錢，最後才是月底事件 */
      (ST.fixed||[]).filter(f=>f.when==='preexp').forEach(f=>out.push(fixedStep(f,r)));
      out.push(expenseStep(r));
      (ST.fixed||[]).filter(f=>!f.when).forEach(f=>out.push(fixedStep(f,r)));
      break;
    }
  }
  return out;
}

/* 開場：講師還沒按開始的這段空檔，把每一位的分配比例問完 */

    title:'你的收入要怎麼分到六個帳戶？',
    note:'點下面那格，把你想分的百分比打進去。不分帳戶、只分兩三個都可以——照你真實的生活狀況分。'

/* 分配收入。排在發薪前面：先看這個月的錢會怎麼分，再照著發。 */
function allocStep(r){
  const anySet = [0,1,2,3,4,5].some(i=>i<N() && allocSum(allocOf(i,r))>0);
  const first  = ![0,1,2,3,4,5].some(i=>i<N() && allocKnown(i,r));
  if(first){
    return { id:'alloc', mode:'alloc', badge:'先設定', tone:'',
      title:'你的錢要怎麼分到六個帳戶？',
      note:'點下面的框，把你想分的百分比打進去。不分帳戶、或只分兩三個都可以——'
          +'照你真實的生活狀況分就好，沒有標準答案。',

  }

    title:'這個月的錢，會這樣分',
    note:'下面已經照你設定的比例算好了。等一下領錢的時候，照這些數字把籌碼放進帳戶。'
        +(anySet?'':'　你目前沒有分帳戶，錢會全部放在身上。')

    why:'錢一進來就先分流，剩下的才是能花的。' };
}
function salaryStep(r){
  const jobless=!!ST.jobless;
  return {
    id:'salary', mode:'give', badge:'發錢',
    title: jobless ? '這個月停薪，只有被動收入與投資現金流' : '領這個月的收入',
    money: jobless ? null : ST.income, moneyLabel:'薪水',
    note: jobless
      ? '你的主動收入全停——公司的薪水和知識變現換來的收入都領不到。只剩投資配息與投資帶來的現金流照領，'
       +'下面已經算好你這個月實際領多少。什麼都沒有的話，這個月就是一毛都領不到。'
      : '跟銀行領下面這筆錢，再照你的比例放進帳戶。有投資、有做知識變現的人會比別人多領。',
    why: jobless

    amountOf:(i)=>{
      const p=passiveOf(i,r), o=otherPayOf(i,r,null,jobless);
      return (jobless ? 0 : ST.income) + o + p;
    },
    subOf:(i)=>{
      const p=passiveOf(i,r), o=otherPayOf(i,r,null,jobless), k=knowOf(i); const bits=[];
      if(!jobless) bits.push('薪水 '+fm(ST.income));
      if(o) bits.push('其他收入 '+fm(o));
      if(p) bits.push('投資配息 '+fm(p));
      if(jobless && k) bits.push('（知識變現 '+fm(k)+' 停發）');
      return bits.length?bits.join('　'):'你這個月沒有收入';
    }
  };
}
function settleStep(s,r){
  const h=(E&&E.hold[s.id])||null;
  const anyone = h && h.units.some(u=>u>0);
  const pct=(s.gmPct>0?'+':'')+(s.gmPct||0)+'%';
  if(s.dead){
    const owe=s.owePerUnit||0;
    return { id:'st_'+s.id, mode: owe?'take':'check', badge:'開牌', tone:'take',
      title:'開牌：'+s.title+'　→　'+pct+(owe?'，本金歸零還要再賠':'，本金歸零'),
      note: !anyone ? '你沒有投這一張，直接按完成就好。'
        : owe ? ('你投進去的錢全部收不回來，而且每單位還要再賠 '+fm(owe)+'。'
                +'下面已經算好你要付多少、從哪個帳戶出——先扣投資帳戶，不夠才動其他帳戶，再不夠就是被迫負債。')
              : '你投進去的錢全部收不回來。把桌上那筆投資籌碼收掉。',
      why:'同一張「危機入市」，有人翻倍有人歸零——這就是為什麼投資前要先看懂自己承受得起多少。',
      amountOf:(i)=>((h&&h.units[i])||0)*owe,
      subOf:(i)=>{ const u=(h&&h.units[i])||0;
        if(!u) return '你沒有投這一張';
        return owe? `你投的 ${u} 單位（${fm(u*s.unit)}）歸零，還要再賠 ${u} × ${fm(owe)}`
                  : `你投的 ${u} 單位（${fm(u*s.unit)}）全部歸零`; } };
  }
  return { id:'st_'+s.id, mode:'give', badge:'開牌',
    title:'開牌：'+s.title+'　→　'+pct+'，發投資報酬',
    note: anyone ? '跟銀行領下面這筆錢，並決定它要放進哪一個帳戶——預設是投資帳戶，想放別格就點一下改。'+(s.backPrincipal?'這張含本金退還，領完你手上就沒有這筆投資了。':'本金繼續留著，之後每個月還會有配息。')
                 : '你沒有投這一張，直接按完成就好。',
    why:'兩個月前敢投的人，現在拿到報酬——投資的果實從來不是當下就看得到的。',
    amountOf:(i)=>((h&&h.units[i])||0)*(s.perUnit||0),
    subOf:(i)=>{ const u=(h&&h.units[i])||0;
      if(!u) return '你沒有投這一張';
      return s.one ? `你投了一筆 ${fm(u*s.unit)}` : `你投了 ${u} 單位 × 每單位 ${fm(s.perUnit)}`; } };
}
function cardStep(c,r){

             +(c.cf>0?('買了之後從下個月起，每個月配息 '+fm(c.cf)+'。'):'')

  }
  /* 好消息：發錢，會照他的分配比例自動分流 */

      why:'投資只能用投資帳戶的錢。' },
    check:{ id:'m_check', ph:'expense', mode:'check', badge:'確認', title:'這個月的事件',
      note:'照講師在台上說的做，做完打勾。', why:'' }
  };
  return CS.mAct && acts[CS.mAct] ? [acts[CS.mAct]] : [];
}

/* =====================================================================
   5. 畫面
===================================================================== */
let STEPS=[];
/* 手動模式的步驟也歸到它「本來屬於」的階段，重播引擎才找得到 */
function stPhase(st){ return CS.manual ? (st.ph||'expense') : (ST?ST.phase:'-'); }
function markKey(st){ return curRound()+'|'+stPhase(st)+'|'+st.id; }
function markOf(st){
  const k=markKey(st);
  if(!CS.marks[k]) CS.marks[k]={ tick:z6(), cnt:z6(), loan:z6(), acct:e6() };
  if(!CS.marks[k].acct) CS.marks[k].acct=e6();
  return CS.marks[k];
}
/* 「這筆錢放進哪一格」的小列。只有真的有錢要落地時才出現，
   預設那一格先亮著——學員沒特別說，組長一下都不用點，節奏不會被拖慢。 */
function acctPick(st,i,dflt,label,narrow){
  const cur=acctOf(markOf(st),i,dflt);
  /* narrow＝這一格右下角還有「−／借」小按鈕，要留位置給它們，不然會壓到 */
  return `<div class="apick${narrow?' narrow':''}"><span class="al">${label}</span>`
    + ACCS.map(k=>`<button class="${k===cur?'on':''}" onclick="event.stopPropagation();setAcct(${i},'${k}')">${ANAME[k]}</button>`).join('')
    + `</div>`;
}
function setAcct(i,k){
  const st=STEPS[CS.cur.i]; if(!st) return;
  markOf(st).acct[i]=k; saveCS(); render();
}
/* 這一步、這位學員的計算明細（引擎重播時算出來的，畫面直接顯示，不會跟帳算的不一樣） */
function detOf(st,i){ const d=E&&E.det[markKey(st)]; return d? d[i]||null : null; }
/* 投資帳戶（加上他自己開口借的錢）最多買得起幾單位 */
function maxUnitsFor(i,st,D){
  const avail=D?(D.avail||0):0, m=markOf(st);
  const cap=Math.floor((avail+(m.loan[i]||0))/st.price);
  return st.one ? Math.min(1,cap) : cap;      /* 一筆制：最多就是 1 */
}
function applyState(){
  absorbState();
  const key=phaseKey();
  if(CS.cur.k!==key){ CS.cur={ k:key, i:0 }; }   /* 講師推進到下一階段 → 副控自動跳到第一步 */
  render(); saveCS(); report();
}
function render(){
  if(!CS) return;
  if(CS.manual) absorbManual();
  E=recompute();                                  /* 每次畫面更新都從第 1 月重算一次 */
  STEPS=buildSteps();
  if(CS.cur.i>=STEPS.length) CS.cur.i=Math.max(0,STEPS.length-1);
  renderTop(); renderOrder(); renderBal(); renderBar();
}
function phaseName(){
  if(CS.manual) return '手動模式';
  if(!ST) return '尚未連線';
  if(!ST.started) return '講師還沒開始';
  if(ST.round>ST.rounds) return '遊戲結束';
  return { salary:'發薪日', allocate:'分配收入', event:'準備翻牌',
           drawn:'事件結算', expense:'繳生活費' }[ST.phase] || '';
}
function renderTop(){
  const r=curRound(), tot=(ST&&ST.rounds)||12;
  $('#tMon').textContent = r? `第 ${r} 月／${tot}` : '第 — 月';
  $('#tPh').textContent = phaseName();
  $('#tTag').textContent = `${CS.room}・${nameOf(0)}`;
}
function renderOrder(){
  const box=$('#order'), grid=$('#grid');
  const st=STEPS[CS.cur.i];
  if(!st){
    box.className=''; box.innerHTML='';
    grid.innerHTML=`<div class="waitbox" style="grid-column:1/-1">
      <div class="big">${CS.manual?'手動模式：請從右上角 ☰ 選這一步要做什麼':'等講師開始這個月'}</div>
      <div class="sm">畫面會自己跟著講師走，你不用做任何事。<br>你的帳本存在這支手機裡，不會不見。</div></div>`;
    return;
  }
  const tone = st.tone || ({give:'give', take:'take', units:'inv', count:'inv'}[st.mode] || '');
  box.className = tone;

    <div class="oline">

    ${st.note?`<div class="onote">${st.note}</div>`:''}

/* 指令卡上的大數字。有些步驟每個人的金額不一樣（薪水含配息、生活費含利息），
   大數字只寫「大家共同的那一段」，實際要收發多少一律以每位學員格子上的數字為準。 */
function moneyLine(st){
  if(st.moneyLabel) return st.moneyLabel+' ＄'+fm(st.money);
  if(st.mode==='give') return '每人 ＄'+fm(st.money);
  if(st.mode==='take') return '每人 ＄'+fm(st.money);
  if(st.mode==='units') return (st.one?'一筆 ＄':'每單位 ＄')+fm(st.money);
  return '＄'+fm(st.money);
}
function renderGrid(st){
  const grid=$('#grid'); const m=markOf(st); const r=curRound();
  if(st.mode==='info'){
    grid.innerHTML = (st.id==='final') ? finalGrid()
      : `<div class="waitbox" style="grid-column:1/-1">
          <div class="big">這一步不用付錢也不用領錢</div>
          <div class="sm">看完上面那段話，按右下角的「完成」。</div></div>`;
    return;
  }
  let h='';
  for(let i=0;i<N();i++){
    const cls=[];
    let big='', sub='', mini='', pick='';
    const D = detOf(st,i);
    if(st.mode==='give'){
      const amt = st.amountOf? st.amountOf(i) : (D?D.amt:(st.money||0));
      big = money(amt);
      sub = st.subOf? st.subOf(i) : '';
      if(!sub && D && D.parts && D.parts.length)
        sub = '會分成 '+D.parts.map(p=>ANAME[p.k]+' '+fm(p.a)).join('、')+(D.rest>0?('、現金 '+fm(D.rest)):'');
      /* 開牌拿到的投資報酬：學員自己決定進哪一格 */
      if(st.id.indexOf('st_')===0 && amt>0) pick=acctPick(st,i,'invest','這筆放進');
      if(m.tick[i]) cls.push('done');
    }
    else if(st.mode==='take'){
      /* 這一格顯示的就是引擎真的算出來的：實收多少、從哪個帳戶出、不夠的記多少負債 */
      const amt = D? D.amt : (st.amountOf? st.amountOf(i) : (st.money||0));
      const bits=[];
      if(D){
        if(D.waived) bits.push(`用儲蓄 ${fm(D.waived)} 換掉生活費`);
        if(D.covered) bits.push(`娛樂折抵 ${fm(D.covered)}`);
        if(D.keep) bits.push(`貴人保留 ${fm(D.keep)}`);
        if(D.used && D.used.length) bits.push(D.used.map(u=>(ANAME[u.k]||'待分配')+' '+fm(u.use)).join('、'));
        if(D.interest) bits.push(`含利息 ${fm(D.interest)}`);
      }
      big = (amt===0) ? '不用付' : money(amt);
      sub = bits.join('　') || (st.subOf? st.subOf(i):'');
      if(D && D.borrowed){
        cls.push('forced');
        big = money(amt);
        sub = `帳戶掏空還差 ${fm(D.short)}　→　被迫負債 ＋${fm(D.borrowed)}`
            + (D.change>0 ? `，找零 ${fm(D.change)}` : '');
        if(D.change>0) pick=acctPick(st,i,'life','找零放進');
      }
      else if(m.tick[i]) cls.push('done');
    }
    else if(st.mode==='alloc'){
      const tr = st.allocFor || r;
      const al = allocOf(i,tr), set = allocKnown(i,tr);
      const inc = (E&&E.incTot[i])||0;
      if(set) cls.push('done');
      const cnt = allocCount(al);
      big = set ? (cnt? `${cnt} 個帳戶` : '不分帳戶') : '還沒問';
      if(!set) sub='點一下設定';
      else if(!cnt) sub='錢全部放身上（月光族）';
      else{
        /* 志工要對的是桌上的籌碼，所以優先顯示金額；沒收入時才顯示百分比 */
        const on=ACCS.filter(k=>al[k]>0);
        sub = inc>0
          ? on.map(k=>ANAME[k]+' '+fm(Math.floor(inc*al[k]/100))).join('　')
            + (allocSum(al)<100 ? `　現金 ${fm(inc-on.reduce((s,k)=>s+Math.floor(inc*al[k]/100),0))}` : '')
          : on.map(k=>ANAME[k]+' '+al[k]+'%').join('　');
      }
      mini=`<div class="mini"><button onclick="event.stopPropagation();openDrawer('alloc',${i})">設定</button></div>`;
    }
    else if(st.mode==='units'){
      const u=m.cnt[i], lo=m.loan[i];
      const avail = D? D.avail : 0;
      const cap = maxUnitsFor(i,st,D);
      if(u) cls.push('picked');
      big = u? (st.one?'投了':`${u} 單位`) : '—';
      const need=u*st.price;
      if(u) sub = `應收 ${fm(Math.max(0,need-lo))}`+(lo?`　（借款 ${fm(lo)}）`:'');
      else sub = cap>0 ? (st.one?`投資帳戶 ${fm(avail)}　點一下＝投 ${fm(st.price)}`:`投資帳戶 ${fm(avail)}　最多 ${cap} 單位`)
                       : `投資帳戶 ${fm(avail)}，買不起`;
      const spare=Math.max(0, lo-u*st.price);
      if(spare>0){ sub += `　多借 ${fm(spare)}`; pick=acctPick(st,i,'invest','多借的放進',true); }
      /* 借款刻意不放在這一層：「可以跟銀行借」是要學員自己想到的事，
         主控台從頭到尾不提，實體課要開口問志工才辦得成。線上版的等價動作
         ＝自己去點「明細」，借款的按鈕在那裡面。 */
      mini=`<div class="mini">
        <button onclick="event.stopPropagation();bumpUnit(${i},-1)">−</button></div>`;
    }
    else if(st.mode==='count'){
      const u=m.cnt[i], amt=u*st.unitAmt;
      const avail = D? D.avail : 0;
      const cap = countCap(i,st,D,u);
      if(u) cls.push('picked');
      big = u? money(amt) : '—';
      sub = u? `${u} 份 × ${fm(st.unitAmt)}${st.take?'（跟他收）':''}${(D&&D.credit&&D.credit!==amt)?`　捐款額記 ${fm(D.credit)}`:''}`
             : (cap>0? `${ANAME[st.acct]||''}帳戶 ${fm(avail)}　最多 ${cap} 份` : `${ANAME[st.acct]||''}帳戶沒錢，做不了`);
      mini=`<div class="mini"><button onclick="event.stopPropagation();bumpUnit(${i},-1)">−</button></div>`;
    }
    else { /* check */
      if(D && D.poor!==undefined){          /* 無意識消費：系統自己判斷誰是月光族 */
        if(D.poor){ cls.push('forced'); big='要全部收回'; sub='沒有分帳戶＝月光族，現金＋生活帳戶清空'; }
        else{ cls.push('done'); big='免執行'; sub='有 2 個以上帳戶，安全過關'; }
      }else{
        if(m.tick[i]) cls.push('done');
        big = m.tick[i]? '已完成' : '點一下打勾';
        sub = st.subOf? st.subOf(i) : '';
      }
    }
    h+=`<div class="stu ${cls.join(' ')}">
      <span class="tick">✓</span>
      <div class="hit" onclick="tapStu(${i})"></div>
      <div class="nm">${nameOf(i)}
        <button style="margin-left:auto;margin-right:24px;font-size:13px;color:var(--ink-soft);position:relative;z-index:2"
          onclick="event.stopPropagation();openDrawer('stu',${i})">明細</button></div>
      <div class="amt">${big}</div>
      <div class="sub">${sub||''}</div>
      ${pick}
      <div class="led">${ledgerLine(i,r)}</div>
      ${mini}
    </div>`;
  }
  grid.innerHTML=h;
}
/* 常駐帳戶列：學員隨時看得到自己六個帳戶、現金、投資、負債與兩個結算指標。
   全部從重播引擎現算，跟上面那格用的是同一份數字。 */
function renderBal(){
  const box=$('#mybal'); if(!box) return;
  if(!E || !CS.joined){ box.innerHTML=''; return; }
  const r=curRound()||1;
  const grow={invest:1,learn:1,give:1};
  const cells=ACCS.map(k=>`<div class="b ${grow[k]?'grow':''}">
      <div class="l">${ANAME[k]}</div><div class="v">${fm(E.A[0][k])}</div></div>`).join('')
    + `<div class="b"><div class="l">現金</div><div class="v">${fm(E.pocket[0])}</div></div>`
    + `<div class="b grow"><div class="l">持有投資</div><div class="v">${fm(assetOf(0))}</div></div>`;
  const debt=debtOf(0);
  const net=netOf(0), flow=flowOf(0);

  box.innerHTML=`<h4>我 的 帳 戶</h4>
    <div class="bgrid">${cells}

    </div>
    <div class="sum">
      <span>淨資產 <b class="${net<0?'neg':''}">${fm(net)}</b></span>
      <span>每月淨現金流 <b class="${flow<0?'neg':''}">${fm(flow)}</b></span>
      ${pas?`<span>被動收入 <b>${fm(pas)}</b>/月</span>`:''}
      ${oth?`<span>其他收入 <b>${fm(oth)}</b>/月</span>`:''}
    </div>`;

function ledgerLine(i,r){
  const bits=[];
  /* 還沒分配的錢先標成「待分配」，志工才不會以為那是他已經分好的現金 */
  if(E.incoming[i]>0) bits.push('待分配 '+fm(E.incoming[i]));
  const c=cashOf(i)-E.incoming[i]; if(c||!E.incoming[i]) bits.push('現金 '+fm(c));
  const a=assetOf(i); if(a) bits.push('投資 '+fm(a));
  const p=passiveOf(i,r); if(p) bits.push('配息 '+fm(p)+'/月');
  if(E.loan[i]) bits.push(`<span class="lo">貸款 ${fm(E.loan[i])}</span>`);
  if(E.debt[i]) bits.push(`<span class="bad">欠款 ${fm(E.debt[i])}</span>`);
  return bits.join('　');
}
function finalGrid(){
  let h='';
  const r=curRound();
  for(let i=0;i<N();i++){
    const net=netOf(i), flow=flowOf(i);
    h+=`<div class="stu"><div class="hit" onclick="openDrawer('stu',${i})"></div>
      <div class="nm">${nameOf(i)}</div>
      <div class="amt" style="color:${net<0?'var(--brick)':'var(--green-900)'}">${money(net)}</div>
      <div class="sub">淨資產　｜　每月淨現金流 <b style="color:${flow<0?'var(--brick)':'var(--green-900)'}">${money(flow)}</b></div>
      <div class="sub" style="margin-top:4px">
        現金 ${fm(cashOf(i))}　投資 ${fm(assetOf(i))}　配息 ${fm(passiveOf(i,r+1))}/月<br>
        貸款 ${fm(E.loan[i])}　<span style="color:var(--brick)">欠款 ${fm(E.debt[i])}</span>　捐款 ${fm(E.donated[i])}</div></div>`;
  }
  return h;
}
function renderBar(){
  const st=STEPS[CS.cur.i];
  const last = CS.cur.i>=STEPS.length-1;
  $('#bBack').disabled = CS.cur.i<=0;
  const go=$('#bGo');
  if(!st){ go.textContent='等待中'; go.className='go'; $('#bMid').textContent=''; return; }
  if(st.id==='alloc0'){                       /* 開場設定比例 */
    const done=stepDoneCount(st)>=1;
    go.textContent = done ? '等講師開始' : '設定我的預算 →';
    go.className = 'go' + (done?'':' ready');
    $('#bMid').innerHTML = done ? '預算設好了，等講師開始第 1 月' : '還沒設定你的預算比例';
    return;
  }
  const fin=allDone();
  go.textContent = fin ? '已完成 ✓' : (last? '這個月我做完了 ✓' : '完成，下一步 →');
  go.className = 'go' + (last?' fin':'') + (!fin && stepReady(st)?' ready':'');
  $('#bMid').innerHTML = fin ? '你做完了，等講師繼續' : `第 ${CS.cur.i+1} 步／共 ${STEPS.length} 步`;
}
function stepDoneCount(st){
  const m=markOf(st);
  if(st.mode==='units'||st.mode==='count') return m.cnt.slice(0,N()).filter(x=>x>0).length;
  if(st.mode==='alloc'){
    const tr=st.allocFor||curRound(); let c=0;
    for(let i=0;i<N();i++) if(allocKnown(i,tr)) c++;
    return c;
  }
  return m.tick.slice(0,N()).filter(x=>x).length;
}
function stepReady(st){
  if(st.mode==='units'||st.mode==='count'||st.mode==='info') return true;
  if(st.mode==='alloc') return st.allocFor ? true : stepDoneCount(st)>=N();
  return stepDoneCount(st)>=N();
}
/* 「本桌完成」是組長按出來的，不會自己變成完成——主控側欄的數字才不會騙人 */
function phaseKey(){ return CS.manual ? ('manual|'+CS.mRound+'|'+CS.mAct) : (ST? ST.round+'|'+ST.phase : ''); }
function allDone(){ return !!phaseKey() && CS.finKey===phaseKey(); }

/* =====================================================================
   6. 操作
===================================================================== */
function tapStu(i){
  const st=STEPS[CS.cur.i]; if(!st) return;
  const m=markOf(st);
  if(st.mode==='units' || st.mode==='count'){ bumpUnit(i,1); return; }
  if(st.mode==='alloc'){ openDrawer('alloc',i); return; }
  if(st.id==='final'){ openDrawer('stu',i); return; }
  m.tick[i]=m.tick[i]?0:1;
  saveCS(); render();
}
/* ★ 這裡就是階段 6 的核心：買不起就點不動。
   投資上限＝投資帳戶餘額（加上他自己開口借的錢）÷ 每單位價；
   知識變現與捐款的上限＝對應帳戶的餘額。 */
function bumpUnit(i,d){
  const st=STEPS[CS.cur.i]; if(!st) return;
  const m=markOf(st), D=detOf(st,i);
  const now=m.cnt[i]||0, nx=Math.max(0,now+d);
  if(d>0){
    if(st.mode==='units'){
      const cap=maxUnitsFor(i,st,D);
      if(nx>cap){
        const avail=D?(D.avail||0):0;
        /* 這裡刻意不寫「可以跟銀行借」——那是要學員自己想到的事 */
        toast(cap>0
          ? `你的投資帳戶只剩 ${fm(avail)}，最多 ${cap} 單位。`
          : `你的投資帳戶只有 ${fm(avail)}，買不起這一張。`);
        return;
      }
    }
    if(st.mode==='count'){
      const avail=D?(D.avail||0):0;
      const cap=countCap(i,st,D,now);
      if(nx>cap){
        toast(st.alsoCash
          ? `你的錢只夠捐 ${cap} 份（貢獻帳戶 ${fm(avail)}，其餘從你身上的錢出）。`
          : `你的${ANAME[st.acct]||''}帳戶只剩 ${fm(avail)}，最多 ${cap} 份。`);
        return;
      }
    }
  }
  m.cnt[i]=nx;
  if(st.mode==='units' && nx*st.price < (m.loan[i]||0)) m.loan[i]=0;
  saveCS(); render();
}
/* 借款上限＝每月淨現金流 ×10，與規則說明頁那一條一致。
   副控台算得出每位學員真正的現金流，所以這一條是硬擋，不只是提醒。 */
function loanCapOf(i){
  return Math.max(0, flowOf(i))*loanCapX();
}
function bumpLoan(i){
  const st=STEPS[CS.cur.i]; if(!st || st.mode!=='units') return;
  const m=markOf(st);
  const now=m.loan[i]||0, U=loanUnit(), nx=now+U;
  const cost=(m.cnt[i]||0)*st.price;
  /* 借來的錢只能用在這一張投資上。上限＝已經買的金額「再多一個單位」，
     這樣他才有空間往上加一單位；超過就歸零重來，誤觸可救。
     ⚠ 這裡一定要用 st.price（一個投資單位）而不是 U（一萬的借款單位）：
     還沒買半單位時 cost=0，用 U 會讓上限只有一萬，
     20 萬的老屋、10 萬的天使輪就永遠湊不到頭期——按「借」只會在 1 萬與 0 之間跳，
     而那兩張卡本來就是設計成「一個人存不到、要嘛借款要嘛合資」。 */
  const room = st.one ? st.price : cost + st.price;   /* 一筆制買不了第二單位，天花板就是那一筆 */
  if(nx > room){
    m.loan[i]=0; saveCS(); render();
    toast('借款不能超過這一張投資的金額，已歸零重來');
    return;
  }
  /* 借款總額上限＝月淨現金流 ×10（規則說明頁那一條），這裡是硬擋 */
  const cap=loanCapOf(i);
  const otherMonths=Math.max(0,((E&&E.loan[i])||0)-Math.min(now,cost));
  if(otherMonths+nx>cap){
    toast(cap>0
      ? `你的借款上限是月現金流 ×${loanCapX()}＝${fm(cap)}，已經借到頂了。`
      : `你現在的月現金流是 0 或負的，銀行不能再借給你。`);
    return;
  }
  m.loan[i]=nx;
  saveCS(); render();
}
function nextStep(){
  const st0=STEPS[CS.cur.i];
  if(st0 && st0.id==='alloc0'){
    for(let i=0;i<N();i++) if(!allocKnown(i,1)){ openDrawer('alloc',i); return; }
    toast('都問完了，等講師開始第 1 月'); return;
  }
  if(CS.cur.i < STEPS.length-1){ CS.cur.i++; }
  else if(!allDone()){ CS.finKey=phaseKey(); toast('這個月你做完了，等講師繼續'); }
  saveCS(); render(); report();
}
function prevStep(){
  if(CS.cur.i>0){ CS.cur.i--; saveCS(); render(); }
}

/* =====================================================================
   7. 抽屜：學員明細／設定／手動模式
===================================================================== */
function openDrawer(kind,i){
  const p=$('#dPanel');
  if(kind!=='alloc' || i!==ALLOCI) ALLOCAT=null;      /* 換人／換面板就退出修正模式 */
  ALLOCI = (kind==='alloc') ? i : -1;
  if(kind==='stu') p.innerHTML=stuPanel(i);
  else if(kind==='alloc') p.innerHTML=allocPanel(i);
  else if(kind==='manual') p.innerHTML=manualPanel();
  else p.innerHTML=setPanel();
  $('#drawer').classList.add('open');
}
/* 分配比例：六格直接打數字。刻意不寫任何「應該分幾個」的建議——
   分不分、分幾個，是學員自己的決定，也是第 2 月無意識消費要教的東西。 */
let ALLOCAT=null;      /* 修正模式：把生效月份鎖回第 1 月（志工一開始就打錯的情況） */
let ALLOCI=-1;         /* 現在打開的是哪一位，換人就自動退出修正模式 */
function allocNatural(){
  const st=STEPS[CS.cur.i], tot=(ST&&ST.rounds)||12;
  const r=Math.min(Math.max(1,curRound()), tot);      /* 遊戲跑完了就別再寫到第 13 月 */
  if(st && st.mode==='alloc') return st.allocFor || r;
  return r;
}
function allocTarget(){ return ALLOCAT || allocNatural(); }
function amtOf(inc,p){ return (inc>0 && p>0) ? fm(Math.floor(inc*p/100)) : ''; }
function restLine(al,inc){
  const sum=allocSum(al);
  if(sum>100) return `超過 100% 了（多了 ${sum-100}%），請改回來`;
  if(sum===100) return '100% 都分完了，身上不留現金';
  const cash = inc>0 ? `（${fm(inc-ACCS.reduce((s,k)=>s+Math.floor(inc*al[k]/100),0))}）` : '';
  return `沒分配到的 ${100-sum}% 會直接放在他身上當現金${cash}`;
}
function allocPanel(i){
  const tr=allocTarget(), nat=allocNatural(), fixing=(ALLOCAT===1 && nat>1);
  const al=Object.assign(zAcc(), allocOf(i,tr));
  const inc=(E&&E.incTot[i])||0;
  const rows=ACCS.map(k=>`
    <div class="alrow">
      <span class="an"><i class="adot" style="background:${ACOLOR[k]}"></i>${ANAME[k]}</span>
      <input class="ain" id="ain-${k}" type="number" inputmode="numeric" pattern="[0-9]*"
        min="0" max="100" value="${al[k]||''}" placeholder="0"
        onfocus="this.select()" oninput="setAllocK(${i},'${k}',this.value)" onblur="snapAlloc(${i},'${k}',this)">
      <span class="pc">%</span>
      <span class="am" id="am-${k}">${amtOf(inc,al[k])}</span>
    </div>`).join('');
  const later = fixing ? allocLaterThan(i,1) : 0;
  const fix = nat>1 ? `
    <div class="afix ${fixing?'on':''}">
      ${fixing
        ? `<b>修正模式：改的是第 1 月的比例</b><br>
           按完之後第 1 月到現在<b>每一個月都會用新比例重算一次</b>，
           帳戶餘額、生活費、投資上限都會自己更新。桌上的籌碼請照新的數字重擺。
           ${later?`<br>注意：他在第 ${later} 月自己調過一次比例，那次的調整會保留。`:''}
           <button onclick="allocFix(${i},0)">不用了，改回「從第 ${nat} 月起生效」</button>`
        : `一開始就記錯了嗎？<br>現在改的是<b>從第 ${nat} 月起生效</b>（學員自己想換比例）。
           如果是你一開始打錯、前面幾個月都算錯了——
           <button onclick="allocFix(${i},1)">是我一開始打錯，回第 1 月改並全部重算</button>`}
    </div>` : '';
  const nx=(i+1<N())?i+1:-1;
  return `<button class="dx" onclick="closeDrawer()">✕</button>
    <h3>我 的 分 配 比 例</h3>
    <div class="ahint">
      把他自己說的數字直接打進去。<b>不分帳戶、只分兩三個，都可以</b>——那是他的選擇。<br>
      ${tr>1?`這次設定<b>從第 ${tr} 月開始生效</b>。`:'第 1 月起生效，之後每個月都照這個比例。'}</div>
    <div class="alloc">${rows}
      <div class="arest ${allocSum(al)>100?'over':''}" id="arest">${restLine(al,inc)}</div>
    </div>
    <div class="apre">
      <button onclick="setPreset(${i},'ml')">他說不分帳戶</button>
      <button onclick="setPreset(${i},'std')">標準六帳戶</button>
    </div>
    ${fix}
    <button class="dbtn" style="border-color:var(--green);color:var(--green-900)"
      onclick="${nx>=0?`openDrawer('alloc',${nx})`:'closeDrawer()'}">
      ${nx>=0?'記好了，問下一位 →':'記好了，回主畫面'}</button>`;
}
/* 打字時只更新右邊的金額和最下面那行，不重畫輸入框——不然游標會跳掉 */
function paintAlloc(i){
  const al=Object.assign(zAcc(), allocOf(i,allocTarget()));
  const inc=(E&&E.incTot[i])||0;
  ACCS.forEach(k=>{ const el=$('#am-'+k); if(el) el.textContent=amtOf(inc,al[k]); });
  const r=$('#arest');
  if(r){ r.className='arest'+(allocSum(al)>100?' over':''); r.innerHTML=restLine(al,inc); }
}
function setAllocK(i,k,v){
  const tr=allocTarget();
  const al=Object.assign(zAcc(), allocOf(i,tr));
  /* 六格加起來不能超過 100%——超過就當場壓回可用的上限，不然引擎會分出負數現金 */
  const left=Math.max(0, 100-(allocSum(al)-(al[k]||0)));
  const raw=parseInt(v,10)||0, val=Math.max(0,Math.min(left,raw));
  if(raw!==val){
    const el=$('#ain-'+k); if(el) el.value=val;
    toast(`六個帳戶加起來不能超過 100%，${ANAME[k]}最多只能填 ${left}%`);
  }
  al[k]=val;
  setAllocAt(i,tr,al); render(); paintAlloc(i);
}
/* 規則說明頁寫的是「以 5% 為單位分配」。打字中不動他（會一直跳），
   離開輸入框才四捨五入到最近的 5，並且一樣不能讓總和超過 100%。 */
function snapAlloc(i,k,el){
  const raw=parseInt(el.value,10)||0;
  const tr=allocTarget();
  const al=Object.assign(zAcc(), allocOf(i,tr));
  const left=Math.max(0, 100-(allocSum(al)-(al[k]||0)));
  let val=Math.round(raw/5)*5;
  val=Math.max(0, Math.min(left, val));
  if(val===raw){ el.value=raw||''; return; }
  el.value=val||'';
  al[k]=val; setAllocAt(i,tr,al); render(); paintAlloc(i);
  toast(`比例以 5% 為單位，${ANAME[k]}幫你調成 ${val}%`);
}
function setPreset(i,p){
  setAllocAt(i,allocTarget(),Object.assign({},PRESET[p]));
  render(); openDrawer('alloc',i);
}
/* 一開始就打錯 → 回第 1 月改。改完 recompute() 會自動把每一個月重跑一次。 */
function allocFix(i,on){
  ALLOCAT = on ? 1 : null;
  render(); openDrawer('alloc',i);
  if(on) toast('現在改的是第 1 月的比例，前面每個月都會跟著重算');
}
function closeDrawer(){ ALLOCAT=null; ALLOCI=-1; $('#drawer').classList.remove('open'); render(); }
/* 借款區塊。只有在「投資機會」那一步才出現——平常不給看，
   免得整場都在提醒學員「你可以借錢」。 */
function loanSection(i){
  const st=STEPS[CS.cur.i];
  if(!st || st.mode!=='units') return '';
  const m=markOf(st), D=detOf(st,i);
  const avail=D?(D.avail||0):0, got=m.loan[i]||0, u=m.cnt[i]||0;
  const short=Math.max(0, st.price-(avail+got));
  /* 借款上限＝月淨現金流 ×10。現金流是負的就借不到——這條規則本身就是要教的東西，
     所以寧可寫清楚為什麼借不到，也不要讓按鈕按下去沒反應。 */
  const cap=loanCapOf(i);
  const otherMonths=Math.max(0, ((E&&E.loan[i])||0) - Math.min(got, u*st.price));
  const blocked = cap<=0 || (otherMonths+got+loanUnit() > cap);
  return `<div class="dsec">跟 銀 行 借 錢</div>
    <div style="font-size:13px;line-height:1.7;color:var(--ink-soft);padding:2px 2px 8px">
      這一張「${st.title}」${st.one?'一筆':'每單位'} <b>${fm(st.price)}</b>，你的投資帳戶有 <b>${fm(avail)}</b>。
      ${short>0?`還差 <b style="color:var(--brick)">${fm(short)}</b> 才買得起。`:'夠買了，借不借都可以。'}<br>
      借款<b>只能用在這一張投資上</b>；每借 1 萬，之後<b>每個月要付 ${fm(Math.round(10000*loanRate()))} 利息</b>，一直付到還完。</div>
    <div class="drow"><div class="k">這一張已經借了</div>
      <div class="v" style="color:var(--gold-deep)">${fm(got)}</div></div>
    <div class="drow"><div class="k">你的借款上限（月淨現金流 ×${loanCapX()}）</div>
      <div class="v" style="${cap<=0?'color:var(--brick)':''}">${fm(cap)}</div></div>
    ${blocked?`<div style="background:var(--brick-50);border:1.5px solid var(--brick);border-radius:10px;
        padding:10px 12px;font-size:13px;line-height:1.65;margin:8px 0 2px">
        ${cap<=0
          ? '你現在的<b>每月淨現金流是 '+fm(flowOf(i))+'</b>，銀行不會借錢給一個每個月都在虧的人——先把現金流做正，才有借力的資格。'
          : '你已經借到上限了（'+fm(cap)+'）。要再借更多，得先把每個月的淨現金流做大。'}</div>`:''}
    <div style="display:flex;gap:8px;margin:8px 0 4px">
      <button class="dbtn" style="flex:1;margin:0;border-color:var(--gold);color:var(--gold-deep)"
        ${blocked?'disabled style="flex:1;margin:0;opacity:.4"':''}
        onclick="borrowMore(${i})">再借 ${fm(loanUnit())}</button>
      ${got?`<button class="dbtn" style="flex:none;width:110px;margin:0" onclick="clearLoan(${i})">不借了</button>`:''}
    </div>
    ${u?'':`<div style="font-size:12px;color:var(--ink-mute);padding:2px">借夠了之後，關掉這個視窗，回上一頁點「投入」。</div>`}`;
}
function borrowMore(i){ bumpLoan(i); const p=$('#dPanel'); if(p) p.innerHTML=stuPanel(i); }
function clearLoan(i){
  const st=STEPS[CS.cur.i]; if(!st || st.mode!=='units') return;
  markOf(st).loan[i]=0; saveCS(); render();
  const p=$('#dPanel'); if(p) p.innerHTML=stuPanel(i);

  return `<button class="dx" onclick="closeDrawer()">✕</button>

    <div class="dsec">六 個 帳 戶
      <button style="float:right;font-size:12px;color:var(--green);font-weight:700"
        onclick="openDrawer('alloc',${i})">改分配比例</button></div>${accs}
    ${loanSection(i)}
    <div class="dsec">持 有 的 投 資</div>${holds}
    <div class="dsec">收 入 與 負 債</div>
    <div class="drow"><div class="k">每月投資配息（被動）</div><div class="v">${fm(passiveOf(i,r+1))}</div></div>
    <div class="drow"><div class="k">每月其他收入（知識變現＋投資現金流）</div><div class="v">${fm(otherOf(i,r+1))}</div>

      <div class="adj"><button onclick="adjAcc('debt',${i},-10000)">−</button>
      <button onclick="adjAcc('debt',${i},10000)">＋</button></div></div>
    <div class="drow"><div class="k">公益累計捐款</div><div class="v">${fm(E.donated[i])}</div></div>

    <div class="dsec">我 這 一 局 的 歷 程</div>

/* 投資單位改的是「當初買的那一步」，所以之後每個月的配息會自動跟著重算 */
function adjHold(k,i,d){
  const h=E.hold[k]; if(!h) return;
  const key=h.buy+'|drawn|card_'+k;
  const m=CS.marks[key]; if(!m){ toast('這筆投資找不到當初的紀錄，請用「改分配比例」旁的帳戶數字修正'); return; }
  m.cnt[i]=Math.max(0,(m.cnt[i]||0)+d);
  if(m.cnt[i]*h.price < (m.loan[i]||0)) m.loan[i]=0;
  saveCS(); render(); openDrawer('stu',i);
}
/* 人工更正：記成「第 r 月的一筆更正」，重播時會套用，之後所有月份自動跟著對 */
function adjAcc(k,i,d){
  const r=Math.max(1,curRound());
  CS.fixes.push({r,i,k,amt:d});
  saveCS(); render(); openDrawer('stu',i);
}
function doRepay(i){
  const r=Math.max(1,curRound());
  const amt=Math.min(loanUnit(), E.loan[i]);
  if(amt<=0) return;
  CS.repay.push({r,i,amt});
  saveCS(); render(); openDrawer('stu',i);
  toast(`還了 ${fm(amt)} 投資貸款`);
}

function manualPanel(){
  let mon='';
  for(let i=1;i<=12;i++) mon+=`<button class="${CS.mRound===i?'on':''}" onclick="setManualRound(${i})">${i}</button>`;
  const acts=[['salary','發薪水'],['alloc','分配到帳戶'],['expense','收生活費'],['invest','投資機會'],['check','逐人確認']];
  let ab='';
  acts.forEach(([k,t])=>ab+=`<button class="dbtn ${CS.mAct===k?'':''}" style="${CS.mAct===k?'border-color:var(--green);color:var(--green-900)':''}" onclick="setManualAct('${k}')">${t}</button>`);
  return `<button class="dx" onclick="closeDrawer()">✕</button>
    <h3>手動模式</h3>
    <div style="font-size:14px;color:var(--ink-soft);line-height:1.65;margin-bottom:14px">
      連不上主控台時用這個。先選現在是第幾月，再選這一步要做什麼；帳本照樣會記。
      主控台恢復連線後會自動切回自動模式。</div>
    <div class="dsec">現 在 是 第 幾 月</div>
    <div class="pick" style="margin-top:10px">${mon}</div>
    <div class="dsec">這 一 步 要 做 什 麼</div>${ab}
    ${ST?'<button class="dbtn" style="margin-top:18px" onclick="backAuto()">回到自動模式（跟著講師走）</button>':''}`;
}
function setManualRound(i){ CS.mRound=i; CS.manual=true; saveCS(); openDrawer('manual'); }
function setManualAct(k){
  CS.mAct=k; CS.manual=true; CS.cur.i=0;
  absorbManual();
  /* 手動模式的投資：補一張假卡進事實表，重播才算得出來 */
  if(k==='invest'){
    const r=CS.mRound, f=CS.mlog[r];
    if(f && !f.card) f.card={ id:'manual_'+r, kind:'inv', title:'投資機會（手動）', unit:10000, cf:0, amt:0 };
  }
  saveCS(); closeDrawer(); render();
}
function backAuto(){ CS.manual=false; CS.mAct=''; saveCS(); closeDrawer(); render(); }
function wipe(){
  if(!confirm('確定要清空這一桌的所有紀錄？投資、貸款、捐款都會不見。')) return;
  if(!confirm('再確認一次：清空之後沒辦法復原。')) return;
  const keep={room:CS.room,table:CS.table,n:CS.n,names:CS.names};
  CS=Object.assign(newLedger(),keep); saveCS(); closeDrawer(); render(); toast('已清空');
}

/* =====================================================================
   8. 開場設定
===================================================================== */
function fillSetup(){
  const nb=$('#nmBox'); nb.innerHTML='';
  const inp=document.createElement('input');
  inp.placeholder='你的名字（可不填）';
  inp.value=(CS&&CS.names[0])||''; inp.dataset.i=0; inp.maxLength=8;
  nb.appendChild(inp);
  $('#goBtn').disabled=false;
}
function startConsole(){
  const room=($('#inRoom').value||'VISION').trim().toUpperCase() || 'VISION';
  if(!CS) CS=newLedger();
  CS.room=room; CS.n=1; CS.joined=true;
  document.querySelectorAll('#nmBox input').forEach(inp=>{ CS.names[+inp.dataset.i]=inp.value.trim(); });
  saveCS();
  $('#setup').style.display='none';
  document.body.classList.add('ready');
  connect(); render();
  /* 進來第一件事就是設自己的預算比例 */
  if(!allocKnown(0,1)) setTimeout(()=>openDrawer('alloc',0), 80);
}

/* =====================================================================
   9. 啟動
===================================================================== */
(function init(){
  CS=loadCS();
  if(CS && CS.joined){
    $('#inRoom').value=CS.room;
    $('#setup').style.display='none';
    document.body.classList.add('ready');
    connect(); render();
  }else{
    CS=CS||newLedger();
    fillSetup();
  }
  /* 分頁被切走再切回來（志工看別的東西又回來）→ 立刻跟主控要一份最新狀態 */
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && TX){ hello(); checkLink(); }
  });
})();
</script>
